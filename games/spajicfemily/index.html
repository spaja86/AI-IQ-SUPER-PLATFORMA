<!doctype html>
<html lang="sr-Latn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPAJIĆfemily</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1c241d;color:#fff4d8;font:16px system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:18px}h1{font-size:clamp(34px,7vw,68px);line-height:1;margin:0;letter-spacing:-.06em}header p{color:#dcbe77}canvas{display:block;width:100%;aspect-ratio:16/9;border:1px solid #748163;border-radius:14px;background:#263420}p{margin:8px 0}#status{font-weight:750;color:#ffe3a0;min-height:1.5em}#stats,#construction{color:#e0e9cd}nav,.move,.answers{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}button{font:inherit;color:inherit;background:#344434;border:1px solid #75866c;border-radius:8px;padding:8px 10px;min-height:44px;touch-action:none}button:focus-visible{outline:3px solid #ffe19c}button:active{background:#52674a}button:disabled{opacity:.55}.primary{background:#805523}section{padding:10px 12px;margin-top:12px;border:1px solid #576849;border-radius:10px;background:#232e23}small{color:#cfd9bc}
.scene{position:relative}.ambience{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;border-radius:14px}
</style>
<main>
<header><h1>SPAJIĆfemily</h1><p>Porodična avantura · Od škole do svog doma</p></header>
<div class="scene"><canvas id="world" width="960" height="540" aria-label="Perspektivni prikaz šume, radionice i gradilišta"></canvas><img id="ambience-old" class="ambience" alt="" aria-hidden="true"><img id="ambience-new" class="ambience" alt="" aria-hidden="true"></div>
<p id="status" role="status"></p><p id="stats"></p><p id="construction"></p>
<div class="move" aria-label="Kretanje">
<button data-key="ArrowLeft" aria-label="Levo">←</button><button data-key="ArrowUp" aria-label="Napred">↑</button>
<button data-key="ArrowDown" aria-label="Nazad">↓</button><button data-key="ArrowRight" aria-label="Desno">→</button>
</div>
<nav aria-label="Akcije">
<button class="primary" id="attack">Napad</button><button id="switch">Promeni vođu</button>
<button id="spear">Koplje · 2 drveta</button><button id="hammer">Čekić · 1 drvo + 2 kamena</button>
<button id="power">Snaga · 1 bod</button><button class="primary" id="build">Gradi</button><button id="restart">Nova igra</button>
</nav>
<section aria-label="Porodična radionica">
<p id="lesson"></p>
<div class="answers"><button id="answer0"></button><button id="answer1"></button></div>
<nav aria-label="Dodatne delatnosti"><button id="wood">Stolarija · +2 drveta</button><button id="stone">Kamenorez · +2 kamena</button></nav>
</section>
<p><small>WASD ili strelice za kretanje. Razmak za napad. Radionica je na početku staze, a gradilište na kraju.</small></p>
</main>
<script src="game.js"></script>
<script src="atmosphere.js"></script>
<script src="view.js"></script>
</html>
