<!doctype html>
<html lang="sr-Latn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPAJA Arkada</title>
<style>
:root{color-scheme:dark;--ink:#f7edd8;--muted:#bacabf;--accent:#ffc273;--line:#38524f}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 80% 0,#234943,transparent 55%),#111c20;color:var(--ink);font:16px system-ui,sans-serif}
main{max-width:1040px;margin:auto;padding:clamp(16px,4vw,42px)}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font-size:clamp(34px,6vw,72px);letter-spacing:-.075em;line-height:.95;margin:0}label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:4px}
.pick{display:flex;align-items:end;gap:8px;flex-wrap:wrap}select,button{min-height:44px;border:1px solid var(--line);border-radius:9px;padding:9px 13px;color:var(--ink);background:#203536;font:inherit}select{max-width:min(310px,100%)}button{cursor:pointer;font-weight:650}button:hover{background:#31514b}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}#random,.active{color:#251809;background:var(--accent);border-color:var(--accent)}#random:hover,.active:hover{background:#ffdaa1}
.scene{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px 18px 0 0;background:#254644}canvas{display:block;width:100%;aspect-ratio:2/1}.heading{position:absolute;left:clamp(12px,3vw,30px);bottom:12px;max-width:85%;pointer-events:none;text-shadow:0 2px 10px #0005}.heading span{display:block;font-size:.82rem;font-weight:650;color:#fff1ca}.heading h2{margin:3px 0;font-size:clamp(21px,5vw,46px);line-height:1.08;letter-spacing:-.04em}
.controls{background:#18282b;border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:clamp(12px,3vw,24px)}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.summary p{margin:0;color:var(--muted)}#prompt{font-size:clamp(17px,2.5vw,22px);font-weight:700;margin:12px 0}#actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}#actions.grid{grid-template-columns:repeat(3,minmax(0,1fr));max-width:420px}#actions button{overflow-wrap:anywhere;text-align:left}#actions.grid button{text-align:center}#restart{margin-top:14px}progress{accent-color:var(--accent);max-width:100%;width:155px}
@media(max-width:690px){header{align-items:start;flex-direction:column}.pick{width:100%}canvas{aspect-ratio:16/10}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<main><header><h1>SPAJA Arkada</h1><div class="pick"><div><label for="choose">Izaberi izazov</label><select id="choose"></select></div><button id="random">Nasumična igra</button></div></header>
<section class="scene"><canvas id="illustration" width="960" height="480" aria-hidden="true"></canvas><div class="heading"><span id="genre"></span><h2 id="title"></h2></div></section>
<section class="controls"><div class="summary"><p id="score" role="status"></p><progress id="progress" aria-label="Napredak izazova"></progress></div><p id="prompt"></p><div id="actions"></div><button id="restart">Počni ponovo</button></section></main>
<script src="game.js"></script><script src="view.js"></script></html>
