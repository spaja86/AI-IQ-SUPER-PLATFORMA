name: DIGITRON — Validator

on:
  pull_request:
    paths:
      - 'src/lib/digitron/**'
      - 'src/app/api/digitron/**'
      - 'src/tests/lib/digitron.test.ts'
      - 'src/tests/api/digitron-route.test.ts'
      - 'docs/DIGITRON.md'
      - 'docs/MULTI-REPO-LINKS.md'
      - '.agent-config.json'
      - '.github/workflows/digitron-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/digitron/**'
      - 'src/app/api/digitron/**'
      - 'src/tests/lib/digitron.test.ts'
      - 'src/tests/api/digitron-route.test.ts'
      - 'docs/DIGITRON.md'
      - 'docs/MULTI-REPO-LINKS.md'
      - '.agent-config.json'
      - '.github/workflows/digitron-validator.yml'
  workflow_dispatch:

concurrency:
  group: digitron-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: digitron
      lint_paths: >-
        src/lib/digitron
        src/app/api/digitron
      test_commands: |
        npx tsx src/tests/lib/digitron.test.ts
        npx tsx src/tests/api/digitron-route.test.ts
      scan_paths: >-
        src/lib/digitron
        src/app/api/digitron
      label: digitron
      perf_eval_ms: 50
      perf_api_ms: 200
