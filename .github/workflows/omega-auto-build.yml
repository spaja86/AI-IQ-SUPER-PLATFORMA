# ═══════════════════════════════════════════════════════════
# 🏗️ OMEGA Auto Build — CI Pipeline
# ═══════════════════════════════════════════════════════════
#
# Automatski CI quality gate na svaki push/PR.
# Source of truth za deploy/build je Vercel; ovaj workflow radi
# quality validaciju (type-check, lint, unit test, smoke, predeploy), bez deploy koraka.
#

name: 🏗️ Omega Build

on:
  push:
    branches: ['main', 'copilot/**']
  pull_request:
    branches: ['main']

concurrency:
  group: omega-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: 🏗️ Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🧭 Detekcija izmenjenih putanja
        if: github.event_name == 'pull_request'
        id: changed_paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            full_gate:
              - '.github/workflows/**'
              - '.agent-config.json'
              - 'package.json'
              - 'package-lock.json'
              - 'vercel.json'
              - 'src/lib/auth/**'
              - 'src/lib/billing/**'
              - 'src/lib/stripe/**'
              - 'src/lib/security/**'
              - 'docs/MULTI-REPO-LINKS.md'
            lib_api:
              - 'src/lib/**'
              - 'src/app/api/**'
            tests_autofinish:
              - 'src/tests/autofinish/**'
            tests_billing:
              - 'src/tests/billing/**'
            tests_brouvzer:
              - 'src/tests/brouvzer/**'
            tests_call_centar:
              - 'src/tests/call-centar/**'
            tests_depon:
              - 'src/tests/depon/**'
            tests_unit:
              - 'src/tests/unit/**'
            tests_api:
              - 'src/tests/api/**'
            tests_lib:
              - 'src/tests/lib/**'

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔍 Preflight — Okruženje i verzije
        run: |
          echo "## 🔍 Preflight — Okruženje" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parametar | Vrednost |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Runner** | \`$RUNNER_OS\` / \`$RUNNER_ARCH\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Node.js** | \`$(node --version)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **npm** | \`$(npm --version)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Workflow** | \`${{ github.workflow }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Actor** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Vreme** | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **actions/checkout** | \`v4\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **actions/setup-node** | \`v4 (Node 22)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      - name: 📥 Instalacija zavisnosti
        run: npm ci

      - name: 🔍 TypeScript provera
        run: npx tsc --noEmit

      - name: 🔍 ESLint provera
        run: npm run lint

      - name: 🧪 Unit testovi
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            npm run test:ci
            exit 0
          fi

          if [ "${{ steps.changed_paths.outputs.full_gate }}" = "true" ]; then
            echo "Critical surfaces changed → running full CI test chain"
            npm run test:ci
            exit 0
          fi

          npm run test:core

          if [ "${{ steps.changed_paths.outputs.lib_api }}" = "true" ]; then
            npm run test:lib
            npm run test:api
          fi

          if [ "${{ steps.changed_paths.outputs.tests_lib }}" = "true" ]; then
            npm run test:lib
          fi

          if [ "${{ steps.changed_paths.outputs.tests_api }}" = "true" ]; then
            npm run test:api
          fi

          if [ "${{ steps.changed_paths.outputs.tests_autofinish }}" = "true" ]; then
            npm run test:autofinish:critical
          fi

          if [ "${{ steps.changed_paths.outputs.tests_billing }}" = "true" ]; then
            npm run test:billing
          fi

          if [ "${{ steps.changed_paths.outputs.tests_brouvzer }}" = "true" ]; then
            npm run test:brouvzer
          fi

          if [ "${{ steps.changed_paths.outputs.tests_call_centar }}" = "true" ]; then
            npm run test:call-centar
          fi

          if [ "${{ steps.changed_paths.outputs.tests_depon }}" = "true" ]; then
            npm run test:depon
          fi

          if [ "${{ steps.changed_paths.outputs.tests_unit }}" = "true" ]; then
            npm run test:unit
          fi

      - name: 🧪 Smoke testovi (go-live gate)
        run: npm run test:smoke

      - name: 🚦 Predeploy operativna provera
        run: npm run predeploy:check

      - name: 🏗️ Build provera (release gate)
        run: npm run build

      - name: 📊 Build izveštaj
        if: always()
        run: |
          echo "## 🏗️ CI Quality Izveštaj" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Vreme:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Quality gates:** type-check, lint, unit test, smoke, predeploy, build" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "- **Test strategy:** changed-path selective suites (full chain on critical surfaces)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Test strategy:** full CI suite chain" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📝 Deploy Status Artifact
        if: github.ref == 'refs/heads/main' && success()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat > public/deploy_status.json <<EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "${VERSION}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "status": "success",
            "run_id": "${{ github.run_id }}",
            "actor": "${{ github.actor }}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/deploy_status.json
          git diff --cached --quiet || git commit -m "ci: update deploy_status.json [skip ci]"
          git push
