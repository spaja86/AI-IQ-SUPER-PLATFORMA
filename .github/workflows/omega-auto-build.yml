# ═══════════════════════════════════════════════════════════
# 🏗️ OMEGA Auto Build — CI Pipeline
# ═══════════════════════════════════════════════════════════
#
# Automatski build, lint, i type-check na svaki push/PR.
# Obezbeđuje da evolucione promene ne kvare sistem.
#

name: 🏗️ Omega Build

on:
  push:
    branches: ['main', 'copilot/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    name: 🏗️ Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔍 Preflight — Okruženje i verzije
        run: |
          echo "## 🔍 Preflight — Okruženje" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parametar | Vrednost |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Runner** | \`$RUNNER_OS\` / \`$RUNNER_ARCH\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Node.js** | \`$(node --version)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **npm** | \`$(npm --version)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Workflow** | \`${{ github.workflow }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Actor** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Vreme** | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **actions/checkout** | \`v4\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **actions/setup-node** | \`v4 (Node 22)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          node --version || { echo "❌ Node.js nije dostupan na runneru"; exit 1; }

      - name: 📥 Instalacija zavisnosti
        run: npm ci

      - name: 🔍 TypeScript provera
        run: npx tsc --noEmit

      - name: 🔍 ESLint provera
        run: npx eslint src/

      - name: 🧪 Smoke testovi (go-live gate)
        run: npx tsx src/tests/smoke/smoke.test.ts

      - name: 🏗️ Next.js Build
        run: npx next build

      - name: 📊 Build izveštaj
        if: always()
        run: |
          echo "## 🏗️ Build Izveštaj" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Vreme:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
