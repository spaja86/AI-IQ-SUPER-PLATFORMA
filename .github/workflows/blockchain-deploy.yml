name: 🔗 Deploy AIIQWorldBank Pametni Ugovor

# Pokreće se ručno — kliknite "Run workflow" na GitHub Actions stranici
# i izaberite mrežu (amoy = besplatno testiranje, polygon = produkcija)
on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Mreža za deploy'
        required: true
        default: 'amoy'
        type: choice
        options:
          - amoy
          - polygon
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production
      confirm_production:
        description: 'Za production unesite: DEPLOY_PRODUCTION'
        required: false
        default: ''

concurrency:
  group: blockchain-deploy-${{ github.event.inputs.network }}-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy na ${{ github.event.inputs.network }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: 📥 Preuzmi kod
        uses: actions/checkout@v4

      - name: ⚙️ Postavi Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instaliraj zavisnosti
        run: npm ci --legacy-peer-deps

      - name: 🛑 Production confirmation gate
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ] && [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY_PRODUCTION" ]; then
            echo "❌ Production deploy zahteva confirm_production=DEPLOY_PRODUCTION"
            exit 1
          fi

      - name: 🔍 TypeScript gate
        run: npx tsc --noEmit

      - name: 🧪 Unit test gate
        run: npm test

      - name: 🧪 Smoke test gate
        run: npm run test:smoke

      - name: 🚦 Predeploy gate
        run: npm run predeploy:check

      - name: 🛡️ Dependency audit gate
        run: npm audit --audit-level=high

      - name: 🔑 Secret safety gate
        run: |
          if find . -name ".env" -o -name ".env.*" | grep -q .; then
            echo "❌ .env fajlovi ne smeju biti deo deploy konteksta."
            exit 1
          fi
          echo "✅ Secret safety gate passed"

      - name: 🔨 Kompajliraj ugovor
        run: npx hardhat compile

      - name: 🚀 Deploya ugovor na ${{ github.event.inputs.network }}
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL || 'https://polygon-rpc.com' }}
          POLYGON_AMOY_RPC_URL: ${{ secrets.POLYGON_AMOY_RPC_URL || 'https://rpc-amoy.polygon.technology' }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: npx hardhat run scripts/deploy.ts --network ${{ github.event.inputs.network }}

      - name: 📋 Prikaži deployovanu adresu
        run: |
          if [ -f .env.deployed ]; then
            echo "## ✅ Ugovor uspešno deployovan!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Mreža:** ${{ github.event.inputs.network }}" >> $GITHUB_STEP_SUMMARY
            ADDR=$(grep "NEXT_PUBLIC_CONTRACT_ADDRESS" .env.deployed | cut -d'=' -f2)
            echo "**Adresa:** $ADDR" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ github.event.inputs.network }}" = "amoy" ]; then
              echo "**Explorer:** https://amoy.polygonscan.com/address/$ADDR" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Explorer:** https://polygonscan.com/address/$ADDR" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**📋 Sledeci korak:** Postavite \`NEXT_PUBLIC_CONTRACT_ADDRESS=$ADDR\` u produkcione environment varijable aplikacije" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📊 Deploy Audit Log
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 📊 Blockchain Deploy — Audit Log" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Polje | Vrednost |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Network** | ${{ github.event.inputs.network }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | ${{ github.event.inputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Actor** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Run ID / Attempt** | \`${{ github.run_id }} / ${{ github.run_attempt }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Time** | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Quality gates** | \`type-check, unit test, smoke, predeploy, security\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: redeploy poslednjeg stabilnog contract release taga za isti network i ažurirati `NEXT_PUBLIC_CONTRACT_ADDRESS`." >> "$GITHUB_STEP_SUMMARY"
