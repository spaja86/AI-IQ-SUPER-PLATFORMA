name: EKVIVALENT NETWORK — Validator

on:
  pull_request:
    paths:
      - 'src/lib/ekvivalent-network/**'
      - 'src/app/api/ekvivalent-network/**'
      - 'src/tests/lib/ekvivalent-network.test.ts'
      - 'src/tests/api/ekvivalent-network-route.test.ts'
      - '.github/workflows/ekvivalent-network-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/ekvivalent-network/**'
      - 'src/app/api/ekvivalent-network/**'
      - 'src/tests/lib/ekvivalent-network.test.ts'
      - 'src/tests/api/ekvivalent-network-route.test.ts'
  workflow_dispatch:

concurrency:
  group: ekvivalent-network-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: ekvivalent-network
      lint_paths: >-
        src/lib/ekvivalent-network
        src/app/api/ekvivalent-network
      test_commands: |
        npx tsx src/tests/lib/ekvivalent-network.test.ts
        npx tsx src/tests/api/ekvivalent-network-route.test.ts
      scan_paths: >-
        src/lib/ekvivalent-network
        src/app/api/ekvivalent-network
      label: ekvivalent-network
      perf_eval_ms: 50
      perf_api_ms: 200
