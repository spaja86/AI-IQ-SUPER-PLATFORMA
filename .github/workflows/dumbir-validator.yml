name: ÐUMBIR — Validator

on:
  pull_request:
    paths:
      - 'src/lib/dumbir/**'
      - 'src/app/api/dumbir/**'
      - 'src/tests/lib/dumbir.test.ts'
      - 'src/tests/api/dumbir-route.test.ts'
      - 'docs/DUMBIR.md'
      - '.github/workflows/dumbir-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/dumbir/**'
      - 'src/app/api/dumbir/**'
      - 'src/tests/lib/dumbir.test.ts'
      - 'src/tests/api/dumbir-route.test.ts'
      - 'docs/DUMBIR.md'
  workflow_dispatch:

concurrency:
  group: dumbir-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: dumbir
      lint_paths: >-
        src/lib/dumbir
        src/app/api/dumbir
      test_commands: |
        npx tsx src/tests/lib/dumbir.test.ts
        npx tsx src/tests/api/dumbir-route.test.ts
      scan_paths: >-
        src/lib/dumbir
        src/app/api/dumbir
      label: dumbir
      perf_eval_ms: 50
      perf_api_ms: 200
