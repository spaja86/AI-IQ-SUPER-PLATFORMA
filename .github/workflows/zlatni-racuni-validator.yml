name: ZLATNI RAČUNI — Validator

on:
  pull_request:
    paths:
      - 'src/lib/zlatni-racuni/**'
      - 'src/app/api/zlatni-racuni/**'
      - 'src/components/zlatni-racuni/**'
      - 'src/tests/lib/zlatni-racuni.test.ts'
      - 'src/tests/api/zlatni-racuni-route.test.ts'
      - '.github/workflows/zlatni-racuni-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/zlatni-racuni/**'
      - 'src/app/api/zlatni-racuni/**'
      - 'src/components/zlatni-racuni/**'
      - 'src/tests/lib/zlatni-racuni.test.ts'
      - 'src/tests/api/zlatni-racuni-route.test.ts'
  workflow_dispatch:

concurrency:
  group: zlatni-racuni-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: zlatni-racuni
      lint_paths: >-
        src/lib/zlatni-racuni
        src/app/api/zlatni-racuni
        src/components/zlatni-racuni
      test_commands: |
        npx tsx src/tests/lib/zlatni-racuni.test.ts
        npx tsx src/tests/api/zlatni-racuni-route.test.ts
      scan_paths: >-
        src/lib/zlatni-racuni
        src/app/api/zlatni-racuni
      label: zlatni-racuni
      perf_eval_ms: 50
      perf_api_ms: 200
