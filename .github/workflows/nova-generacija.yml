name: Nova Generacija — Validation

on:
  pull_request:
    paths:
      - 'src/lib/spaja-pro-nova-generacija.ts'
      - 'src/lib/evolucija/nova-generacija.ts'
      - 'src/lib/nova-generacija-gaming.ts'
      - 'src/app/api/nova-generacija/**'
      - 'src/app/nova-generacija/**'
      - 'src/lib/sekvence/nova-generacija-page.ts'
      - 'platforms/nova-generacija/**'
      - 'docs/NOVA-GENERACIJA.md'
      - '.github/workflows/nova-generacija.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/spaja-pro-nova-generacija.ts'
      - 'src/lib/evolucija/nova-generacija.ts'
      - 'src/lib/nova-generacija-gaming.ts'
      - 'src/app/api/nova-generacija/**'
      - 'docs/NOVA-GENERACIJA.md'
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Run full Nova Generacija validation suite'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  ng-lint:
    name: Nova Generacija — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Nova Generacija modules
        run: |
          npm run lint -- \
            src/lib/spaja-pro-nova-generacija.ts \
            src/lib/evolucija/nova-generacija.ts \
            src/lib/nova-generacija-gaming.ts

  ng-typecheck:
    name: Nova Generacija — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

  ng-build-check:
    name: Nova Generacija — Build (≤ 3 min)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build check
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  ng-predeploy:
    name: Nova Generacija — Predeploy Checks
    runs-on: ubuntu-latest
    needs: [ng-lint, ng-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run predeploy check
        run: npm run predeploy:check

  ng-security:
    name: Nova Generacija — Security Scan
    runs-on: ubuntu-latest
    needs: [ng-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (Nova Generacija dependencies)
        run: npm audit --audit-level=high

      - name: Scan for secrets in NG modules
        run: |
          echo "Scanning Nova Generacija modules for secrets..."
          ! grep -rE "(password|secret|token|key)\s*=\s*['\"][^'\"]{8,}" \
            src/lib/spaja-pro-nova-generacija.ts \
            src/lib/evolucija/nova-generacija.ts \
            src/lib/nova-generacija-gaming.ts \
            src/app/api/nova-generacija/ 2>/dev/null || \
            (echo "::error::Potential secret found in Nova Generacija modules" && exit 1)
          echo "No secrets detected."

  ng-label:
    name: Nova Generacija — Auto Label
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const toAdd = [];

            if (!labels.includes('nova-generacija')) {
              toAdd.push('nova-generacija');
            }
            if (!labels.includes('agent:config-change') &&
                context.payload.pull_request.changed_files > 0) {
              // Only add if .github/workflows or .agent-config.json changed
              // (label added by workflow path trigger already covers this)
            }

            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: toAdd,
              });
            }

  ng-status:
    name: Nova Generacija — Status Summary
    runs-on: ubuntu-latest
    needs: [ng-lint, ng-typecheck, ng-predeploy, ng-security]
    if: always()
    steps:
      - name: Nova Generacija validation summary
        run: |
          echo "========================================"
          echo "Nova Generacija Validation Summary"
          echo "========================================"
          echo "Lint:      ${{ needs.ng-lint.result }}"
          echo "TypeScript:${{ needs.ng-typecheck.result }}"
          echo "Predeploy: ${{ needs.ng-predeploy.result }}"
          echo "Security:  ${{ needs.ng-security.result }}"
          echo "========================================"
          echo "KPIs:"
          echo "  Action evaluation target: ≤ 50ms"
          echo "  Build duration target:    ≤ 3 min"
          echo "  Uptime SLA target:        99.99%"
          echo "  Cross-repo sync:          100%"
          echo "========================================"

          if [ "${{ needs.ng-lint.result }}" != "success" ] || \
             [ "${{ needs.ng-typecheck.result }}" != "success" ] || \
             [ "${{ needs.ng-predeploy.result }}" != "success" ] || \
             [ "${{ needs.ng-security.result }}" != "success" ]; then
            echo "❌ Nova Generacija validation FAILED"
            exit 1
          else
            echo "✅ Nova Generacija validation PASSED"
          fi
