name: ADUTIV — Validator

on:
  pull_request:
    paths:
      - 'src/lib/adutiv/**'
      - 'src/app/api/adutiv/**'
      - 'src/components/adutiv/**'
      - 'src/tests/lib/adutiv.test.ts'
      - 'src/tests/api/adutiv-route.test.ts'
      - '.github/workflows/adutiv-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/adutiv/**'
      - 'src/app/api/adutiv/**'
      - 'src/components/adutiv/**'
      - 'src/tests/lib/adutiv.test.ts'
      - 'src/tests/api/adutiv-route.test.ts'
  workflow_dispatch:

concurrency:
  group: adutiv-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: adutiv
      lint_paths: >-
        src/lib/adutiv
        src/app/api/adutiv
        src/components/adutiv
      test_commands: |
        npx tsx src/tests/lib/adutiv.test.ts
        npx tsx src/tests/api/adutiv-route.test.ts
      scan_paths: >-
        src/lib/adutiv
        src/app/api/adutiv
      label: adutiv
      perf_eval_ms: 50
      perf_api_ms: 200
