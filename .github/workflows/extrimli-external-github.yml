name: EXTRIMLI — External GitHub Surface

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'docs/EXTRIMLI.md'
      - 'docs/EXTRIMLI-DEVELOPER-CREATE-PROGRAM.md'
      - 'docs/EXTRIMLI-VRH-PROGRAMSKOG-EKVILADENTA.md'
      - 'docs/EXTRIMLI-METRICKO-PROGRAMIRANJE.md'
      - 'docs/EXTRIMLI-SINEMETRICKO-PROGRAMIRANJE.md'
      - 'docs/EXTRIMLI-PARADIJOGONALNO-PROGRAMIRANJE.md'
      - 'docs/AI-IQ-PROGRAMSKI-JEZIK.md'
      - 'docs/AI-IQ-WORLD-BANK-AI-IDENTITY-FINANCE-GOVERNANCE.md'
      - 'docs/PROGRAMSKI-JEZIK-INFORMACIONIH-TOKOVA.md'
      - 'docs/PROGRAMSKI-JEZIK-PARADIGMA-I-OBLIKOVANJE-TELA.md'
      - 'docs/EXTRIMLI-EXTERNAL-GITHUB.md'
      - 'docs/MULTI-REPO-LINKS.md'
      - '.agent-config.json'
      - '.github/workflows/extrimli-validator.yml'
      - '.github/workflows/extrimli-external-github.yml'
      - '.github/workflows/extrimli-spaja-deploy.yml'
      - '.github/workflows/extrimli-trance-extrem-deploy.yml'
      - '.github/workflows/extrimli-governance-conformance.yml'
      - 'src/lib/extrimli/instrukcija.ts'
      - 'src/lib/extrimli/export-bundle.ts'
      - 'src/lib/extrimli-extendol/**'
      - 'src/lib/extrimli-koron/**'
      - 'src/lib/extrimli-extrondend/**'
      - 'src/lib/extrimli-extrondol/**'
      - 'src/lib/extrimli-extrem/**'
      - 'src/app/api/extrimli/extendol/**'
      - 'src/app/api/extrimli/koron/**'
      - 'src/app/api/extrimli/extrondend/**'
      - 'src/app/api/extrimli/extrondol/**'
      - 'src/app/api/extrimli/extrem/**'
      - 'src/app/api/extrimli/instrukcija/**'
      - 'src/tests/lib/extrimli-instrukcija.test.ts'
      - 'src/tests/lib/extrimli-extendol.test.ts'
      - 'src/tests/lib/extrimli-koron.test.ts'
      - 'src/tests/lib/extrimli-extrondend.test.ts'
      - 'src/tests/lib/extrimli-extrondol.test.ts'
      - 'src/tests/lib/extrimli-extrem.test.ts'
  push:
    branches: [main]
    paths:
      - 'docs/EXTRIMLI.md'
      - 'docs/EXTRIMLI-DEVELOPER-CREATE-PROGRAM.md'
      - 'docs/EXTRIMLI-VRH-PROGRAMSKOG-EKVILADENTA.md'
      - 'docs/EXTRIMLI-METRICKO-PROGRAMIRANJE.md'
      - 'docs/EXTRIMLI-SINEMETRICKO-PROGRAMIRANJE.md'
      - 'docs/EXTRIMLI-PARADIJOGONALNO-PROGRAMIRANJE.md'
      - 'docs/AI-IQ-PROGRAMSKI-JEZIK.md'
      - 'docs/AI-IQ-WORLD-BANK-AI-IDENTITY-FINANCE-GOVERNANCE.md'
      - 'docs/PROGRAMSKI-JEZIK-INFORMACIONIH-TOKOVA.md'
      - 'docs/PROGRAMSKI-JEZIK-PARADIGMA-I-OBLIKOVANJE-TELA.md'
      - 'docs/EXTRIMLI-EXTERNAL-GITHUB.md'
      - 'docs/MULTI-REPO-LINKS.md'
      - '.agent-config.json'
      - '.github/workflows/extrimli-validator.yml'
      - '.github/workflows/extrimli-external-github.yml'
      - '.github/workflows/extrimli-spaja-deploy.yml'
      - '.github/workflows/extrimli-trance-extrem-deploy.yml'
      - '.github/workflows/extrimli-governance-conformance.yml'
      - 'src/lib/extrimli/instrukcija.ts'
      - 'src/lib/extrimli/export-bundle.ts'
      - 'src/lib/extrimli-extendol/**'
      - 'src/lib/extrimli-koron/**'
      - 'src/lib/extrimli-extrondend/**'
      - 'src/lib/extrimli-extrondol/**'
      - 'src/lib/extrimli-extrem/**'
      - 'src/app/api/extrimli/extendol/**'
      - 'src/app/api/extrimli/koron/**'
      - 'src/app/api/extrimli/extrondend/**'
      - 'src/app/api/extrimli/extrondol/**'
      - 'src/app/api/extrimli/extrem/**'
      - 'src/app/api/extrimli/instrukcija/**'
      - 'src/tests/lib/extrimli-instrukcija.test.ts'
      - 'src/tests/lib/extrimli-extendol.test.ts'
      - 'src/tests/lib/extrimli-koron.test.ts'
      - 'src/tests/lib/extrimli-extrondend.test.ts'
      - 'src/tests/lib/extrimli-extrondol.test.ts'
      - 'src/tests/lib/extrimli-extrem.test.ts'
  workflow_dispatch:

concurrency:
  group: extrimli-external-github-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔎 Validate EXTRIMLI external GitHub references
        run: |
          node <<'NODE'
          const fs = require('fs');

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          const doc = fs.readFileSync('docs/EXTRIMLI-EXTERNAL-GITHUB.md', 'utf8');
          const developerCreateProgramDoc = fs.readFileSync('docs/EXTRIMLI-DEVELOPER-CREATE-PROGRAM.md', 'utf8');
          const links = fs.readFileSync('docs/MULTI-REPO-LINKS.md', 'utf8');
          const extrimli = fs.readFileSync('docs/EXTRIMLI.md', 'utf8');
          const worldBankDoc = fs.readFileSync('docs/AI-IQ-WORLD-BANK-AI-IDENTITY-FINANCE-GOVERNANCE.md', 'utf8');
          const developerCreateContract = fs.readFileSync('src/lib/extrimli/developer-create-vrh-ekviladenta-contract.ts', 'utf8');
          const config = JSON.parse(fs.readFileSync('.agent-config.json', 'utf8'));
          const agent = config.agents['extrimli-validator-agent'];

          assert(doc.includes('extrimli:external-github'), 'canonical doc must declare extrimli:external-github label');
          assert(doc.includes('spaja86/IO-OPENUI-AO'), 'canonical doc must declare downstream repo');
          assert(doc.includes('.github/workflows/extrimli-external-github.yml'), 'canonical doc must reference governance workflow');
          assert(doc.includes('.github/workflows/extrimli-governance-conformance.yml'), 'canonical doc must reference governance conformance workflow');
          assert(doc.includes('WAWE 1') && doc.includes('WAWE 5'), 'canonical doc must define WAWE 1-5 rollout phases');
          assert(doc.includes('Promotion freeze'), 'canonical doc must define promotion freeze guard');
          assert(doc.includes('docs/EXTRIMLI.md') && doc.includes('docs/MULTI-REPO-LINKS.md'), 'canonical doc must lock source-of-truth docs');
          assert(doc.includes('DEVELOPER AND CREATE / VRH PROGRAMSKOG EKVILADENTA / AI PLATE'), 'canonical doc must declare AI PLATE enterprise package');
          assert(doc.includes('12.000 EUR') && doc.includes('premium-rollout-regime'), 'canonical doc must lock weekly AI PLATE pricing governance');
          assert(doc.includes('paymentCycle=monthly-or-annual'), 'canonical doc must preserve the enterprise master billing lock');
          assert(developerCreateProgramDoc.includes('docs + types + routes + tests + workflows'), 'Developer/Create program doc must lock docs/types/routes/tests/workflows');
          assert(developerCreateProgramDoc.includes('roadmapStageId=Verzija 7') && developerCreateProgramDoc.includes('premium-rollout-regime'), 'Developer/Create program doc must lock V7 AI PLATE execution and pricing governance');
          assert(developerCreateProgramDoc.includes('src/tests/lib/extrimli-extrem.test.ts') && developerCreateProgramDoc.includes('src/tests/lib/extrimli-extrondol.test.ts'), 'Developer/Create program doc must lock EXTREM/EXTRONDOL tests');
          assert(developerCreateProgramDoc.includes('DOK + DIK + FOR') && developerCreateProgramDoc.includes('DOK/DIK/DAK/DUK/FOR'), 'Developer/Create program doc must include FOR in the ownership and consistency lock');
          assert(developerCreateProgramDoc.includes('AI IQ WORLD BANK PREPISKA') && developerCreateProgramDoc.includes('documentation-only governance evidence'), 'Developer/Create program doc must lock AI IQ WORLD BANK prepiska as documentation-only governance evidence');
          assert(developerCreateProgramDoc.includes('DEVELOPER AND CREATE == VRH PROGRAMSKOG EKVILADENTA == KRALJEVSKI PROGRAMSKI UNEVERZITET'), 'Developer/Create program doc must lock the unified KRALJEVSKI programmatic narrative');
          assert(developerCreateProgramDoc.includes('DEVELOPER AND CREATE == VRH PROGRAMSKOG EKVILADENTA == DIJALIZA POGONSKOG OMOTAČA'), 'Developer/Create program doc must lock DIJALIZA POGONSKOG OMOTAČA additive alias');
          assert(developerCreateProgramDoc.includes('DEVELOPER AND CREATE == VRH PROGRAMSKOG EKVILADENTA == NOTES 1450') && developerCreateProgramDoc.includes('bounded radni-handoff paket'), 'Developer/Create program doc must lock NOTES 1450 bounded work continuation package');
          assert(developerCreateProgramDoc.includes('DEVELOPER AND CREATE == VRH PROGRAMSKOG EKVILADENTA') && developerCreateProgramDoc.includes('Kompanija SPAJA / Digitalna Industrija'), 'Developer/Create program doc must lock canonical scope and enterprise mapping');
          assert(developerCreateContract.includes('DEVELOPER_CREATE_VRH_DIJALIZA_POGONSKOG_OMOTACA_ALIAS') && developerCreateContract.includes('dokDikFor'), 'Developer/Create contract must retain DIJALIZA alias ownership boundary');
          assert(developerCreateContract.includes('DEVELOPER_CREATE_NOTES_1450_CANONICAL_ALIAS') && developerCreateContract.includes('DEVELOPER_CREATE_NOTES_1450_BOUNDED_SIGNALS'), 'Developer/Create contract must retain NOTES 1450 bounded signal contract');
          assert(links.includes('Developer/Create four-track package + `Kompanija SPAJA / Digitalna Industrija` enterprise summary') && links.includes('summary-safe fields'), 'multi-repo links must define the four-track and enterprise summary downstream boundary');
          assert(developerCreateProgramDoc.includes('BEZPOVRATNE SUBVENCIJE') && developerCreateProgramDoc.includes('approval') && developerCreateProgramDoc.includes('payment-verification') && developerCreateProgramDoc.includes('payout-readiness'), 'Developer/Create program doc must lock bezpovratne subvencije governance-only evidence');
          assert(doc.includes('EXTRIMLI_EXTENDOL_CONTRACT_VERSION'), 'canonical doc must declare EXTRIMLI Extendol contract');
          assert(doc.includes('/api/extrimli/extendol'), 'canonical doc must reference EXTRIMLI Extendol unified endpoint');
          assert(doc.includes('/api/extrimli/koron'), 'canonical doc must reference EXTRIMLI KORON endpoint');
          assert(doc.includes('/api/extrimli/extrondend') && doc.includes('/api/extrimli/extrondol'), 'canonical doc must reference EXTRONDEND and EXTRONDOL endpoints');
          assert(doc.includes('nivo-duet:logic-change') && doc.includes('dinkos:logic-change'), 'canonical doc must declare NIVO DUET and DINKOS labels');
          assert(doc.includes('/api/duet/evaluate'), 'canonical doc must reference DUET source signal');
          assert(links.includes('EXTRIMLI — External GitHub Surface'), 'multi-repo links must contain external GitHub section');
          assert(links.includes('EXTRIMLI KORON overlay surface'), 'multi-repo links must contain KORON surface section');
          assert(links.includes('EXTRIMLI EXTRONDEND aggregation surface') && links.includes('EXTRIMLI EXTRONDOL orchestration surface'), 'multi-repo links must include EXTRONDEND/EXTRONDOL sections');
          assert(links.includes('EXTRIMLI NIVO DUET / DINKOS signal contract'), 'multi-repo links must include NIVO DUET / DINKOS section');
          assert(links.includes('EXTRIMLI EXTEMEL/EXTREMOL WAWE map'), 'multi-repo links must include EXTRIMLI WAWE map');
          assert(links.includes('EXTRIMLI governance conformance audit'), 'multi-repo links must include governance conformance section');
          assert(links.includes('AI PLATE enterprise package') && links.includes('audit-safe snapshot'), 'multi-repo links must define AI PLATE downstream audit-safe sync');
          assert(links.includes('AI IQ WORLD BANK prepiska') && links.includes('never sync real bank records'), 'multi-repo links must keep AI IQ WORLD BANK prepiska audit-safe only');
          assert(links.includes('BEZPOVRATNE SUBVENCIJE') && links.includes('operational credentials'), 'multi-repo links must include bezpovratne subvencije governance sync boundary');
          assert(links.includes('IO-OPENUI-AO#<follow-up issue> -> AI-IQ-SUPER-PLATFORMA#EXTRIMLI-EXTERNAL-GITHUB'), 'multi-repo links must include bidirectional audit convention');
          assert(extrimli.includes('docs/EXTRIMLI-EXTERNAL-GITHUB.md'), 'EXTRIMLI doc must reference canonical external GitHub plan');
          assert(extrimli.includes('aiPlateEnterprisePackage') && extrimli.includes('12.000 EUR weekly'), 'EXTRIMLI doc must expose AI PLATE governance fields');
          assert(extrimli.includes('AI IQ WORLD BANK PREPISKA') && extrimli.includes('documentation-only governance evidence'), 'EXTRIMLI doc must expose AI IQ WORLD BANK prepiska audit-safe boundary');
          assert(extrimli.includes('KORON'), 'EXTRIMLI doc must declare KORON scope');
          assert(extrimli.includes('RADNI TAKT MOZGA (MISLILAC)'), 'EXTRIMLI doc must declare RADNI TAKT MOZGA (MISLILAC) additive governance track');
          assert(extrimli.includes('Locked source-of-truth set'), 'EXTRIMLI doc must lock source-of-truth artifact set');
          assert(extrimli.includes('DOK + DIK + FOR'), 'EXTRIMLI doc must lock FOR in the technical ownership boundary');
          assert(extrimli.includes('releaseReadinessScorecard') && extrimli.includes('contractDriftReport') && extrimli.includes('governanceConformance'), 'EXTRIMLI doc must include governance conformance payload fields');
          assert(worldBankDoc.includes('AI IQ WORLD BANK PREPISKA') && worldBankDoc.includes('documentation-only governance evidence'), 'AI IQ WORLD BANK doc must lock prepiska as documentation-only governance evidence');
          assert(worldBankDoc.includes('approval status') && worldBankDoc.includes('payment verification status') && worldBankDoc.includes('downstream sync status'), 'AI IQ WORLD BANK doc must declare allowed audit-safe correspondence evidence');
          assert(worldBankDoc.includes('BEZPOVRATNE SUBVENCIJE') && worldBankDoc.includes('payout readiness'), 'AI IQ WORLD BANK doc must lock bezpovratne subvencije governance-only payout evidence');
          assert(worldBankDoc.includes('stvarne brojeve računa') && worldBankDoc.includes('KYC dokumente') && worldBankDoc.includes('payment secrets'), 'AI IQ WORLD BANK doc must forbid sensitive banking evidence in Git');
          assert(Array.isArray(agent.workflows) && agent.workflows.includes('.github/workflows/extrimli-external-github.yml'), 'agent config must include governance workflow');
          assert(Array.isArray(agent.releaseDocs) && agent.releaseDocs.includes('docs/EXTRIMLI-EXTERNAL-GITHUB.md'), 'agent config must include canonical plan doc');
          assert(agent.githubSurface?.workflow === '.github/workflows/extrimli-external-github.yml', 'agent config githubSurface.workflow mismatch');
          assert(agent.githubSurface?.qualityGate === '.github/workflows/extrimli-validator.yml', 'agent config githubSurface.qualityGate mismatch');
          assert(agent.githubSurface?.linkedRepo === 'spaja86/IO-OPENUI-AO', 'agent config githubSurface.linkedRepo mismatch');
          assert(Array.isArray(agent.githubSurface?.outboundArtifacts) && agent.githubSurface.outboundArtifacts.includes('koron-health-snapshot'), 'agent config must declare KORON outbound artifact');
          assert(Array.isArray(agent.githubSurface?.outboundArtifacts) && agent.githubSurface.outboundArtifacts.includes('extrondend-aggregation-snapshot') && agent.githubSurface.outboundArtifacts.includes('extrondol-orchestration-snapshot'), 'agent config must declare EXTRONDEND/EXTRONDOL outbound artifacts');
          assert(Array.isArray(agent.githubSurface?.outboundArtifacts) && agent.githubSurface.outboundArtifacts.includes('nivo-duet-dinkos-signal'), 'agent config must declare NIVO DUET / DINKOS outbound artifact');
          assert(Array.isArray(agent.multiRepoSync?.snapshots) && agent.multiRepoSync.snapshots.includes('instrukcija-export-bundle'), 'agent config must sync instrukcija-export-bundle');
          assert(Array.isArray(agent.multiRepoSync?.snapshots) && agent.multiRepoSync.snapshots.includes('koron-health-snapshot'), 'agent config must sync KORON snapshot');
          assert(Array.isArray(agent.multiRepoSync?.snapshots) && agent.multiRepoSync.snapshots.includes('extrondend-aggregation-snapshot') && agent.multiRepoSync.snapshots.includes('extrondol-orchestration-snapshot'), 'agent config must sync EXTRONDEND/EXTRONDOL snapshots');
          assert(Array.isArray(agent.multiRepoSync?.snapshots) && agent.multiRepoSync.snapshots.includes('nivo-duet-dinkos-signal'), 'agent config must sync NIVO DUET / DINKOS snapshot');
          NODE

      - name: 🧪 EXTRIMLI export surface tests
        run: npx tsx src/tests/lib/extrimli-instrukcija.test.ts

      - name: 🧪 EXTRIMLI Extendol unified tests
        run: npx tsx src/tests/lib/extrimli-extendol.test.ts

      - name: 🧪 EXTRIMLI KORON overlay tests
        run: npx tsx src/tests/lib/extrimli-koron.test.ts

      - name: 🧪 EXTRIMLI EXTRONDEND aggregation tests
        run: npx tsx src/tests/lib/extrimli-extrondend.test.ts

      - name: 🧪 EXTRIMLI EXTRONDOL orchestration tests
        run: npx tsx src/tests/lib/extrimli-extrondol.test.ts

      - name: 🧪 EXTRIMLI EXTREM profiler tests
        run: npx tsx src/tests/lib/extrimli-extrem.test.ts

      - name: 🧪 DUET integration tests
        run: |
          npx tsx src/tests/lib/duet.test.ts
          npx tsx src/tests/api/duet-route.test.ts

      - name: 📊 Audit summary
        if: always()
        run: |
          echo "## EXTRIMLI External GitHub Surface Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Source |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Canonical doc | \`docs/EXTRIMLI-EXTERNAL-GITHUB.md\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Quality gate | \`.github/workflows/extrimli-validator.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Governance workflow | \`.github/workflows/extrimli-external-github.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy workflows | \`.github/workflows/extrimli-spaja-deploy.yml\`, \`.github/workflows/extrimli-trance-extrem-deploy.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Downstream repo | \`spaja86/IO-OPENUI-AO\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Export contract test | \`src/tests/lib/extrimli-instrukcija.test.ts\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Extendol unified contract test | \`src/tests/lib/extrimli-extendol.test.ts\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| KORON overlay test | \`src/tests/lib/extrimli-koron.test.ts\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EXTRONDEND aggregation test | \`src/tests/lib/extrimli-extrondend.test.ts\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EXTRONDOL orchestration test | \`src/tests/lib/extrimli-extrondol.test.ts\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EXTREM profiler test | \`src/tests/lib/extrimli-extrem.test.ts\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DUET integration tests | \`src/tests/lib/duet.test.ts\`, \`src/tests/api/duet-route.test.ts\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| WAWE model | \`WAWE 1 → WAWE 5\` enforced |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Promotion freeze guard | Required when KPI/audit/sync incomplete |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**KPI targets:** eval ≤ 50ms · API ≤ 200ms · build ≤ 3 min · audit coverage 100%" >> "$GITHUB_STEP_SUMMARY"
