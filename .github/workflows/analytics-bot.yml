name: 📊 Analytics Bot

on:
  schedule:
    # Nightly metrics collection — 03:30 UTC
    - cron: '30 3 * * *'
    # Weekly summary — every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report type to generate'
        required: false
        default: 'summary'
        type: choice
        options:
          - summary
          - full
          - agents-only
          - tests-only

concurrency:
  group: analytics-bot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  # ── 1. Collect workflow run metrics ──────────────────────────────────────
  collect-metrics:
    name: 📊 Collect Workflow Metrics
    runs-on: ubuntu-latest
    outputs:
      report_date: ${{ steps.date.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - name: Set report date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Collect test file count
        run: |
          test_count=$(find src/tests -name '*.test.ts' | wc -l | tr -d ' ')
          echo "TEST_COUNT=$test_count" >> "$GITHUB_ENV"
          echo "Test files found: $test_count"

      - name: Collect agent workflow count
        run: |
          workflow_count=$(ls .github/workflows/*.yml | wc -l | tr -d ' ')
          echo "WORKFLOW_COUNT=$workflow_count" >> "$GITHUB_ENV"
          echo "Workflow files: $workflow_count"

      - name: Collect lib module count
        run: |
          lib_count=$(find src/lib -name '*.ts' | wc -l | tr -d ' ')
          echo "LIB_COUNT=$lib_count" >> "$GITHUB_ENV"
          echo "Lib modules: $lib_count"

      - name: Write metrics summary
        run: |
          echo "## 📊 Analytics Bot — Metrics Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Trigger:** \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ github.event.inputs.report_type }}" ]; then
            echo "**Report type:** \`${{ github.event.inputs.report_type }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Platform Health Snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test files | $TEST_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow files | $WORKFLOW_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lib modules | $LIB_COUNT |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Active Agents" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Agent | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          for wf in .github/workflows/*.yml; do
            name=$(basename "$wf" .yml)
            case "$name" in
              _*|ci-health|vercel-deploy|omega-*|blockchain-*|copilot-*) continue ;;
            esac
            echo "| \`$name\` | ✅ Active |" >> "$GITHUB_STEP_SUMMARY"
          done

  # ── 2. Weekly summary issue (Mondays only) ─────────────────────────────
  weekly-issue:
    name: 📋 Weekly Summary Issue
    runs-on: ubuntu-latest
    needs: [collect-metrics]
    # Only post weekly issue on Monday schedule run
    if: github.event.schedule == '0 4 * * 1' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.report_type == 'summary' || github.event.inputs.report_type == 'full'))
    steps:
      - uses: actions/checkout@v4

      - name: Create weekly analytics issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ needs.collect-metrics.outputs.report_date }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly Analytics Report — ${date}`,
              body: [
                '## 📊 Weekly Analytics Bot Report',
                '',
                `**Week of:** ${date}`,
                `**Run:** ${runUrl}`,
                '',
                '### Summary',
                '',
                'This automated report is generated by the `analytics-bot` agent every Monday at 04:00 UTC.',
                '',
                '### Action Items',
                '',
                '- [ ] Review agent validation pass rates from this week\'s PR runs',
                '- [ ] Check for any failing nightly security scans',
                '- [ ] Review CI health canary status',
                '- [ ] Update `docs/MULTI-REPO-LINKS.md` if any cross-repo changes were made',
                '',
                '### Links',
                '',
                '- [Security Scanner](../../actions/workflows/security-scanner.yml)',
                '- [CI Health Canary](../../actions/workflows/ci-health.yml)',
                '- [Multi-Repo Sync](../../actions/workflows/multi-repo-sync.yml)',
                '',
                '---',
                '_Generated by analytics-bot · AI-IQ-SUPER-PLATFORMA_',
              ].join('\n'),
              labels: ['analytics', 'automated-report'],
            });

  # ── 3. Monthly billing usage check ─────────────────────────────────────
  billing-check:
    name: 💳 GitHub Actions Billing Check
    runs-on: ubuntu-latest
    needs: [collect-metrics]
    # Run on nightly schedule and full workflow_dispatch
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.report_type == 'full' || github.event.inputs.report_type == 'summary'))
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check GitHub Actions usage
        uses: actions/github-script@v7
        with:
          script: |
            // GitHub Actions billing API (requires token with read:org or billing scope)
            // Falls back to workflow count summary if billing scope unavailable
            const SOFT_LIMIT_MINUTES = 1600;
            const HARD_LIMIT_MINUTES = 2000;

            let usedMinutes = null;
            let billingAvailable = false;

            try {
              // Attempt to call billing API — requires GITHUB_TOKEN with billing:read scope
              const billingResp = await github.rest.billing.getGithubActionsBillingOrg({
                org: context.repo.owner,
              }).catch(() => null);

              if (billingResp?.data) {
                usedMinutes = billingResp.data.total_minutes_used;
                billingAvailable = true;
              }
            } catch (_) {
              // Billing API not available on all plans/tokens — log summary only
            }

            const date = '${{ needs.collect-metrics.outputs.report_date }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let summaryLines = [
              '## 💳 GitHub Actions Billing Check',
              '',
              `**Date:** ${date}`,
              `**Run:** ${runUrl}`,
              '',
            ];

            if (billingAvailable && usedMinutes !== null) {
              const pct = Math.round((usedMinutes / HARD_LIMIT_MINUTES) * 100);
              const status = usedMinutes >= HARD_LIMIT_MINUTES ? '🔴 OVER LIMIT'
                           : usedMinutes >= SOFT_LIMIT_MINUTES  ? '🟡 NEAR LIMIT (80%+)'
                           : '🟢 OK';

              summaryLines = summaryLines.concat([
                `| Metric | Value |`,
                `|--------|-------|`,
                `| Minutes used | ${usedMinutes} / ${HARD_LIMIT_MINUTES} (${pct}%) |`,
                `| Status | ${status} |`,
                '',
              ]);

              if (usedMinutes >= SOFT_LIMIT_MINUTES) {
                core.warning(`GitHub Actions minutes at ${pct}% of free tier limit (${usedMinutes}/${HARD_LIMIT_MINUTES}). Review docs/BILLING-TRACKING.md.`);
              }
            } else {
              summaryLines = summaryLines.concat([
                '> ℹ️ Billing API not available for this token scope.',
                '> Monitor usage manually at: https://github.com/settings/billing',
                '> See `docs/BILLING-TRACKING.md` for cost thresholds and optimization tips.',
                '',
              ]);
            }

            summaryLines = summaryLines.concat([
              '### Vercel Usage',
              '',
              '> Monitor Vercel usage at: https://vercel.com/account/usage',
              '> See `docs/BILLING-TRACKING.md` for Vercel thresholds.',
              '',
              '### Optimization Checklist',
              '',
              '- [ ] All workflows have `paths:` filters (no unnecessary runs)',
              '- [ ] All workflows have `concurrency:` groups configured',
              '- [ ] Artifacts use `retention-days: 7`',
              '- [ ] Vercel `regions: ["fra1"]` set in vercel.json',
              '- [ ] `outputFileTracingExcludes` configured in next.config.ts',
              '',
              '---',
              '_Generated by analytics-bot billing-check · AI-IQ-SUPER-PLATFORMA_',
            ]);

            // Write to step summary
            const { appendFileSync } = await import('fs');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, summaryLines.join('\n'));
