name: EXTRIMLI — Validator

on:
  pull_request:
    paths:
      - 'src/lib/extrimli/**'
      - 'src/lib/extrimli-3/**'
      - 'src/app/api/extrimli/**'
      - 'src/app/api/extrimli-3/**'
      - 'src/components/extrimli/**'
      - 'src/tests/lib/extrimli.test.ts'
      - 'src/tests/lib/extrimli-3.test.ts'
      - 'src/tests/api/extrimli-route.test.ts'
      - 'docs/EXTRIMLI.md'
      - 'docs/MULTI-REPO-LINKS.md'
      - '.github/workflows/extrimli-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/extrimli/**'
      - 'src/lib/extrimli-3/**'
      - 'src/app/api/extrimli/**'
      - 'src/app/api/extrimli-3/**'
      - 'src/components/extrimli/**'
      - 'src/tests/lib/extrimli.test.ts'
      - 'src/tests/lib/extrimli-3.test.ts'
      - 'src/tests/api/extrimli-route.test.ts'
      - 'docs/EXTRIMLI.md'
      - 'docs/MULTI-REPO-LINKS.md'
  workflow_dispatch:

concurrency:
  group: extrimli-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: extrimli
      lint_paths: >-
        src/lib/extrimli
        src/lib/extrimli-3
        src/app/api/extrimli
        src/app/api/extrimli-3
        src/components/extrimli
      test_commands: |
        npx tsx src/tests/lib/extrimli.test.ts
        npx tsx src/tests/lib/extrimli-3.test.ts
        npx tsx src/tests/api/extrimli-route.test.ts
      scan_paths: >-
        src/lib/extrimli
        src/lib/extrimli-3
        src/app/api/extrimli
        src/app/api/extrimli-3
      label: extrimli
      perf_eval_ms: 50
      perf_api_ms: 200
