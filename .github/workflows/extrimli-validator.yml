name: EXTRIMLI — Validator

on:
  pull_request:
    paths:
      - 'src/lib/extrimli/**'
      - 'src/lib/extrimli-extendol/**'
      - 'src/lib/extrimli-koron/**'
      - 'src/lib/extrimli-extrondend/**'
      - 'src/lib/extrimli-extrondol/**'
      - 'src/lib/extrimli-duel-king/**'
      - 'src/lib/extrimli-3/**'
      - 'src/app/api/extrimli/**'
      - 'src/app/api/extrimli/duel-king/**'
      - 'src/app/api/extrimli-3/**'
      - 'src/app/api/extrimli/extrondend/**'
      - 'src/app/api/extrimli/extrondol/**'
      - 'src/components/extrimli/**'
      - 'src/lib/extrimli/instrukcija.ts'
      - 'src/lib/extrimli/export-bundle.ts'
      - 'src/app/api/extrimli/instrukcija/**'
      - 'src/tests/lib/extrimli.test.ts'
      - 'src/tests/lib/extrimli-duel-king.test.ts'
      - 'src/tests/lib/extrimli-extendol.test.ts'
      - 'src/tests/lib/extrimli-koron.test.ts'
      - 'src/tests/lib/extrimli-extrondend.test.ts'
      - 'src/tests/lib/extrimli-extrondol.test.ts'
      - 'src/tests/lib/extrimli-3.test.ts'
      - 'src/tests/lib/extrimli-instrukcija.test.ts'
      - 'src/tests/api/extrimli-route.test.ts'
      - 'docs/EXTRIMLI.md'
      - 'docs/EXTRIMLI-EXTERNAL-GITHUB.md'
      - 'docs/MULTI-REPO-LINKS.md'
      - '.agent-config.json'
      - '.github/workflows/extrimli-external-github.yml'
      - '.github/workflows/extrimli-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/extrimli/**'
      - 'src/lib/extrimli-extendol/**'
      - 'src/lib/extrimli-koron/**'
      - 'src/lib/extrimli-extrondend/**'
      - 'src/lib/extrimli-extrondol/**'
      - 'src/lib/extrimli-duel-king/**'
      - 'src/lib/extrimli-3/**'
      - 'src/app/api/extrimli/**'
      - 'src/app/api/extrimli/duel-king/**'
      - 'src/app/api/extrimli-3/**'
      - 'src/app/api/extrimli/extrondend/**'
      - 'src/app/api/extrimli/extrondol/**'
      - 'src/components/extrimli/**'
      - 'src/lib/extrimli/instrukcija.ts'
      - 'src/lib/extrimli/export-bundle.ts'
      - 'src/app/api/extrimli/instrukcija/**'
      - 'src/tests/lib/extrimli.test.ts'
      - 'src/tests/lib/extrimli-duel-king.test.ts'
      - 'src/tests/lib/extrimli-extendol.test.ts'
      - 'src/tests/lib/extrimli-koron.test.ts'
      - 'src/tests/lib/extrimli-extrondend.test.ts'
      - 'src/tests/lib/extrimli-extrondol.test.ts'
      - 'src/tests/lib/extrimli-3.test.ts'
      - 'src/tests/lib/extrimli-instrukcija.test.ts'
      - 'src/tests/api/extrimli-route.test.ts'
      - 'docs/EXTRIMLI.md'
      - 'docs/EXTRIMLI-EXTERNAL-GITHUB.md'
      - 'docs/MULTI-REPO-LINKS.md'
      - '.agent-config.json'
      - '.github/workflows/extrimli-external-github.yml'
  workflow_dispatch:

concurrency:
  group: extrimli-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: extrimli
      lint_paths: >-
        src/lib/extrimli
        src/lib/extrimli-extendol
        src/lib/extrimli-koron
        src/lib/extrimli-extrondend
        src/lib/extrimli-extrondol
        src/lib/extrimli-duel-king
        src/lib/extrimli-3
        src/app/api/extrimli
        src/app/api/extrimli/duel-king
        src/app/api/extrimli-3
        src/app/api/extrimli/extrondend
        src/app/api/extrimli/extrondol
        src/components/extrimli
      test_commands: |
        npx tsx src/tests/lib/extrimli.test.ts
        npx tsx src/tests/lib/extrimli-duel-king.test.ts
        npx tsx src/tests/lib/extrimli-extendol.test.ts
        npx tsx src/tests/lib/extrimli-koron.test.ts
        npx tsx src/tests/lib/extrimli-extrondend.test.ts
        npx tsx src/tests/lib/extrimli-extrondol.test.ts
        npx tsx src/tests/lib/extrimli-3.test.ts
        npx tsx src/tests/lib/extrimli-instrukcija.test.ts
        npx tsx src/tests/api/extrimli-route.test.ts
      scan_paths: >-
        src/lib/extrimli
        src/lib/extrimli-extendol
        src/lib/extrimli-koron
        src/lib/extrimli-extrondend
        src/lib/extrimli-extrondol
        src/lib/extrimli-duel-king
        src/lib/extrimli-3
        src/app/api/extrimli
        src/app/api/extrimli/duel-king
        src/app/api/extrimli-3
        src/app/api/extrimli/extrondend
        src/app/api/extrimli/extrondol
      label: extrimli
      perf_eval_ms: 50
      perf_api_ms: 200
