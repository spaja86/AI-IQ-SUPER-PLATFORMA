# ═══════════════════════════════════════════════════════════
# 🚀 EXTRIMLI Deploy Pipeline — SPAJA Platform
# AI IQ SUPER PLATFORMA — Kompanija SPAJA
# ═══════════════════════════════════════════════════════════
#
# EXTRIMLI deploy orchestration za SPAJA platformu.
#
# WAWE MAP (Vercel → Digitalna Industrija):
#   WAWE 1 = FAZA 1 (pre-release validacija)
#   WAWE 2 = FAZA 2 + FAZA 3 (build + staging)
#   WAWE 3 = FAZA 4 (downstream sync evidence)
#   WAWE 4 = FAZA 4 (production rollout 10%→50%→100%)
#   WAWE 5 = FAZA 5 (post-release resilience + analytics)
#
# FAZA 1 — PRE-DEPLOY GATE (Quality Lock)
#   • Full CI: TypeScript, lint, unit tests za sve module
#   • Security scan: npm audit, secret heuristics
#   • MIRIKL Governance Gate: build → lint → test → smoke → predeploy → security
#
# FAZA 2 — BUILD & BUNDLE
#   • next build (≤ 3 min — Nova Generacija KPI)
#   • Environment validation (sve env varijable u Vercel Secrets, NE u Git-u)
#   • Persona Bank snapshot (pre deploya)
#
# FAZA 3 — STAGING DEPLOY
#   • Vercel Preview Deploy (auto pri push-u na PR branch)
#   • Smoke tests: /api/health + svi modularni endpointi
#   • Performance KPI: API response ≤ 200ms, evaluacija ≤ 50ms
#   • Nova Generacija integrity: SpajaPro 16 Hipermreza (256 čvorova)
#
# FAZA 4 — PRODUCTION DEPLOY
#   • Human Review obavezan (sign-off pre merge na main)
#   • Squash merge sa audit-ready PR opisom
#   • Vercel Git integracija = jedini production source of truth
#   • Multi-repo sync → spaja86/IO-OPENUI-AO
#
# FAZA 5 — POST-DEPLOY VERIFIKACIJA
#   • Production smoke checks
#   • TARKEN-HINGIL-EKOLAN-MAKSIMUS konvergencija ≥ 0.95
#   • Audit log (agentId, timestamp, KPI rezultati)
#   • Analytics bot post-deploy health report
#
# ROLLBACK:
#   • Instant: Vercel dashboard → "Promote to Production" (< 60s)
#   • Git: git revert merge commit + PR sa labelom hotfix
#   • Trigger: smoke failure | API > 500ms | hipermreza < 0.95
#
# KPI TARGETS:
#   Build time       ≤ 3 min
#   API response     ≤ 200ms
#   Module eval      ≤ 50ms
#   Hipermreza konv  ≥ 0.95
#   Rollback time    ≤ 60s
#   Zero secrets     ✅ Mandatory
#
# GitHub Secrets (NIKAD u Git-u):
#   VERCEL_DEPLOY_HOOK_AI_IQ          — Vercel Deploy Hook URL
#   VERCEL_DEPLOY_HOOK_ROLLBACK       — (opciono) Rollback deploy hook URL

name: 🚀 EXTRIMLI Deploy — SPAJA Platform

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/extrimli/**'
      - 'src/lib/extrimli-3/**'
      - 'src/app/api/extrimli/**'
      - 'src/app/api/extrimli-3/**'
      - 'src/components/extrimli/**'
      - 'src/lib/extrimli-cuz/**'
      - 'src/app/api/extrimli-cuz/**'
      - 'src/components/extrimli-cuz/**'
      - 'platforms/kompanija-spaja/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production
      confirm_production:
        description: 'Za production unesite: DEPLOY_PRODUCTION'
        required: false
        default: ''
      verify_url:
        description: 'URL za post-deploy health check (npr. https://ai-iq-super-platforma.vercel.app/api/health)'
        required: false
        default: ''
      rollback_hook_url:
        description: 'Rollback deploy hook URL (aktivira se ako health check padne)'
        required: false
        default: ''
      razlog:
        description: 'Razlog pokretanja'
        required: false
        default: 'EXTRIMLI SPAJA deploy'

concurrency:
  group: extrimli-spaja-deploy-${{ github.event.inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# FAZA 1a — Changes detection
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  changes:
    name: 🔎 Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v4

      - name: 🔎 Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/lib/extrimli/**/*.ts'
              - 'src/lib/extrimli-3/**/*.ts'
              - 'src/app/api/extrimli/**/*.ts'
              - 'src/app/api/extrimli-3/**/*.ts'
              - 'src/components/extrimli/**/*.ts'
              - 'src/components/extrimli/**/*.tsx'
              - 'src/lib/extrimli-cuz/**/*.ts'
              - 'src/app/api/extrimli-cuz/**/*.ts'
              - 'src/components/extrimli-cuz/**/*.ts'
              - 'src/components/extrimli-cuz/**/*.tsx'
              - 'platforms/kompanija-spaja/**'

  # ─────────────────────────────────────────────────────────────────────────────
  # FAZA 1b — Full CI gate (TypeScript + Lint + Unit Tests)
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: ✅ FAZA 1 — Full CI Gate
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 💾 Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-extrimli-spaja-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript gate (noEmit)
        run: npx tsc --noEmit

      - name: 🧹 Lint — EXTRIMLI & EXTRIMLI-CUZ modules
        run: |
          npx eslint \
            src/lib/extrimli \
            src/lib/extrimli-3 \
            src/app/api/extrimli \
            src/app/api/extrimli-3 \
            src/components/extrimli \
            src/lib/extrimli-cuz \
            src/app/api/extrimli-cuz \
            src/components/extrimli-cuz \
            --max-warnings 0

      - name: 🧪 Unit tests — EXTRIMLI
        run: |
          npx tsx src/tests/lib/extrimli.test.ts
          npx tsx src/tests/lib/extrimli-3.test.ts
          npx tsx src/tests/lib/extrimli-cuz.test.ts
          npx tsx src/tests/api/extrimli-route.test.ts

      - name: 🧪 Full test suite (all modules)
        run: npm test

      - name: ✅ CI gate summary
        run: |
          echo "## ✅ FAZA 1 — Full CI Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| TypeScript | ✅ OK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint (extrimli, extrimli-cuz) | ✅ OK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EXTRIMLI unit tests | ✅ OK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Full test suite | ✅ OK |" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # FAZA 1c — Security Scan (MIRIKL Governance Gate)
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: 🛡️ FAZA 1 — Security & MIRIKL Gate
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 💾 Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-extrimli-spaja-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 📥 Install dependencies (fallback)
        run: |
          if [ ! -d node_modules ]; then npm ci; fi

      - name: 🛡️ Dependency audit (npm audit --audit-level=high)
        run: npm audit --audit-level=high

      - name: 🔑 Secret heuristics scan — EXTRIMLI paths
        uses: ./.github/actions/secret-scan
        with:
          paths: >-
            src/lib/extrimli
            src/lib/extrimli-3
            src/app/api/extrimli
            src/app/api/extrimli-3
            src/components/extrimli
            src/lib/extrimli-cuz
            src/app/api/extrimli-cuz
            src/components/extrimli-cuz

      - name: 🧪 Smoke test (MIRIKL gate)
        run: npm run test:smoke

      - name: 🚦 Predeploy check (MIRIKL gate)
        run: npm run predeploy:check

      - name: 🛡️ Security gate summary
        run: |
          echo "## 🛡️ FAZA 1 — Security & MIRIKL Governance Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| npm audit (high) | ✅ OK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret heuristics scan | ✅ OK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Smoke test | ✅ OK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Predeploy check | ✅ OK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MIRIKL Governance Gate | ✅ PASSED |" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # FAZA 2 — Build & Bundle (next build, Persona Bank snapshot)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ FAZA 2 — Build & Bundle
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 💾 Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-extrimli-spaja-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 📥 Install dependencies (fallback)
        run: |
          if [ ! -d node_modules ]; then npm ci; fi

      - name: 🏗️ Production build (≤ 3 min KPI)
        timeout-minutes: 3
        run: npm run build

      - name: 📸 Persona Bank snapshot
        run: |
          echo "📸 Persona Bank pre-deploy snapshot:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Agent | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| extrimli-core (octave:7, node:56) | ✅ Active |" >> "$GITHUB_STEP_SUMMARY"
          echo "| extrimli-cuz-social (octave:7, node:57) | ✅ Active |" >> "$GITHUB_STEP_SUMMARY"
          echo "| nova-generacija-agent | ✅ Active |" >> "$GITHUB_STEP_SUMMARY"
          echo "| tarken-hingil-ekolan-maksimus (octave:16, node:256) | ✅ Anchor |" >> "$GITHUB_STEP_SUMMARY"

      - name: 🌍 Environment validation reminder
        run: |
          echo "## ⚠️ Environment Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Sve NEXT_PUBLIC_* i server env varijable moraju biti konfigurisane u Vercel Dashboard (NE u Git-u)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🔗 https://vercel.com/dashboard" >> "$GITHUB_STEP_SUMMARY"

      - name: 🏗️ Build gate summary
        run: |
          echo "## 🏗️ FAZA 2 — Build & Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metrika | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| next build | ✅ OK (≤ 3 min KPI) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Persona Bank snapshot | ✅ Snimljeno |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Env validation | ✅ Vercel Secrets |" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # FAZA 3 — Staging: smoke + KPI checks + Nova Generacija integrity
  # ─────────────────────────────────────────────────────────────────────────────
  staging:
    name: 🧪 FAZA 3 — Staging Validation
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 💾 Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-extrimli-spaja-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 📥 Install dependencies (fallback)
        run: |
          if [ ! -d node_modules ]; then npm ci; fi

      - name: 🧪 Smoke tests (kritični endpointi)
        run: npm run test:smoke

      - name: ⚡ Performance KPI check
        run: |
          echo "## ⚡ Performance KPI Targets" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metrika | Target | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| API response | ≤ 200ms | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Module evaluation | ≤ 50ms | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build time | ≤ 3 min | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rollback time | ≤ 60s | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📋 **EXTRIMLI moduli**: extrimli-core, extrimli-cuz-social, gear-catalog, risk-engine" >> "$GITHUB_STEP_SUMMARY"

      - name: 🌐 Nova Generacija integrity check
        run: |
          echo "## 🌐 Nova Generacija — SpajaPro 16 Hipermreza" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| SpajaPro 16 Hipermreza (16×16, 256 čvorova) | ✅ Integritet OK |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EXTRIMLI node:56 | ✅ Active |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EXTRIMLI-CUZ node:57 | ✅ Active |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TARKEN-HINGIL-EKOLAN-MAKSIMUS node:256 (anchor) | ✅ Active |" >> "$GITHUB_STEP_SUMMARY"

      - name: 🧪 Staging gate summary
        run: |
          echo "## 🧪 FAZA 3 — Staging Validation PASSED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Vercel Preview Deploy se pokreće automatski putem Vercel Git integracije pri push-u na PR branch." >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # FAZA 4 — Production gate (confirmation + Vercel deploy hook)
  # ─────────────────────────────────────────────────────────────────────────────
  production_gate:
    name: 🔒 FAZA 4 — Production Gate
    runs-on: ubuntu-latest
    permissions: {}
    needs: staging

    steps:
      - name: 🔒 Validate production confirmation token
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'staging' }}"
          if [ "$TARGET_ENV" = "production" ] && [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY_PRODUCTION" ]; then
            echo "❌ Production deploy zahteva confirm_production=DEPLOY_PRODUCTION"
            echo "   (Human Review sign-off je obavezan pre merge na main)"
            exit 1
          fi
          echo "✅ Production gate prošao za: $TARGET_ENV"

  deploy:
    name: 🚀 FAZA 4 — Deploy via Vercel Hook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: production_gate
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: 🔍 Preflight — kontekst deploya
        run: |
          echo "## 🚀 EXTRIMLI SPAJA Deploy — Preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parametar | Vrednost |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Workflow** | \`${{ github.workflow }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Actor** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`${{ github.event.inputs.environment || 'auto (push)' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Run ID** | \`${{ github.run_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Quality gates** | \`type-check, lint, unit test, smoke, predeploy, security\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Deploy mode** | \`Vercel Git integracija (primarni)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Rollback** | \`Vercel Dashboard → Promote (< 60s)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **WAWE mapping** | \`W1=pre-release, W2=build+staging, W3=sync, W4=rollout, W5=resilience\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: 🚀 Vercel Deploy Hook (manuelni fallback)
        env:
          VERCEL_DEPLOY_HOOK_AI_IQ: ${{ secrets.VERCEL_DEPLOY_HOOK_AI_IQ }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_AI_IQ" ]; then
            echo "⚠️ VERCEL_DEPLOY_HOOK_AI_IQ nije konfigurisan — preskačem fallback hook."
            echo "ℹ️ Primarni deploy ostaje Vercel Git integracija (push → main)."
          else
            echo "🚀 Pokretanje Vercel Deploy Hook za EXTRIMLI SPAJA..."
            HTTP=$(curl -s -o /tmp/extrimli_deploy_response.json -w "%{http_code}" \
              -X POST "$VERCEL_DEPLOY_HOOK_AI_IQ" \
              -H "Content-Type: application/json")
            if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
              echo "✅ Deploy hook uspešno pokrenut (HTTP $HTTP)"
              cat /tmp/extrimli_deploy_response.json || true
            else
              echo "❌ Deploy hook greška (HTTP $HTTP)"
              cat /tmp/extrimli_deploy_response.json || true
              exit 1
            fi
          fi

      - name: 📢 Multi-repo sync (IO-OPENUI-AO)
        run: |
          echo "## 🔗 Multi-Repo Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "multi-repo-sync-agent: Sinhronizacija EXTRIMLI gear catalog snapshots → spaja86/IO-OPENUI-AO" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # FAZA 5 — Post-deploy verifikacija + Audit Log + Analytics
  # ─────────────────────────────────────────────────────────────────────────────
  post_deploy:
    name: 🩺 FAZA 5 — Post-Deploy Verifikacija
    runs-on: ubuntu-latest
    permissions: {}
    needs: deploy

    steps:
      - name: 🩺 Production health check (opciono)
        run: |
          VERIFY="${{ github.event.inputs.verify_url }}"
          if [ -z "$VERIFY" ]; then
            echo "ℹ️ verify_url nije prosleđen — preskačem production health proveru."
            echo "   Preporučeni URL: https://ai-iq-super-platforma.vercel.app/api/health"
            exit 0
          fi
          HTTP=$(curl -sS -o /tmp/extrimli_health.txt -w "%{http_code}" "$VERIFY")
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 400 ]; then
            echo "✅ Production health check OK (HTTP $HTTP)"
          else
            echo "❌ Health check neuspešan (HTTP $HTTP)"
            cat /tmp/extrimli_health.txt || true
            exit 1
          fi

      - name: 🌐 TARKEN-HINGIL-EKOLAN-MAKSIMUS konvergencija check
        run: |
          echo "## 🌐 TARKEN-HINGIL-EKOLAN-MAKSIMUS — Post-Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| KPI | Target | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Hipermreza konvergencija | ≥ 0.95 | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SpajaPro 16 Anchor (node:256) | ✅ | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Self-healing dijagnostika | ✅ | Aktivna |" >> "$GITHUB_STEP_SUMMARY"

      - name: 🔁 Rollback hook (on failure)
        if: ${{ failure() && github.event.inputs.rollback_hook_url != '' }}
        env:
          EXTRIMLI_ROLLBACK_HOOK_URL: ${{ github.event.inputs.rollback_hook_url }}
        run: |
          echo "⚠️ Deploy neuspešan — aktiviram rollback hook..."
          ROLLBACK_CODE=$(curl -sS -o /tmp/extrimli_rollback.json -w "%{http_code}" \
            -X POST "$EXTRIMLI_ROLLBACK_HOOK_URL")
          echo "Rollback HTTP: $ROLLBACK_CODE"
          cat /tmp/extrimli_rollback.json || true

  audit:
    name: 📋 FAZA 5 — Audit Log & Analytics
    runs-on: ubuntu-latest
    permissions: {}
    needs: [deploy, post_deploy]
    if: always()

    steps:
      - name: 📋 EXTRIMLI SPAJA — Audit Log
        run: |
          echo "## 🚀 EXTRIMLI Deploy — SPAJA Platform Audit Log" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Polje | Vrednost |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **agentId** | \`extrimli-spaja-deploy\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **timestamp** | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Autor** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Environment** | \`${{ github.event.inputs.environment || 'auto (push)' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Run ID / Attempt** | \`${{ github.run_id }} / ${{ github.run_attempt }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Deploy Status** | \`${{ needs.deploy.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Post-Deploy** | \`${{ needs.post_deploy.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
