name: 🧮 Calculator Validator

on:
  pull_request:
    paths:
      - 'src/lib/gaming-endzin.ts'
      - 'src/lib/gaming-session.ts'
      - 'src/lib/poker/**'
      - 'src/app/api/igrice/**'
      - 'src/tests/lib/pokermaster-catalog.test.ts'
      - 'src/tests/lib/master-poker-domain.test.ts'
      - 'src/tests/lib/master-poker-runner-state.test.ts'
      - '.github/workflows/calculator-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/gaming-endzin.ts'
      - 'src/lib/gaming-session.ts'
      - 'src/lib/poker/**'
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Run full calculator validation suite'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: calculator-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: calculator
      lint_paths: >-
        src/lib/gaming-endzin.ts
        src/lib/gaming-session.ts
      test_commands: |
        npx tsx src/tests/lib/pokermaster-catalog.test.ts
        npx tsx src/tests/lib/master-poker-domain.test.ts
        npx tsx src/tests/lib/master-poker-runner-state.test.ts
        npx tsx src/tests/lib/eksponencionalne-geometrijske-razmere.test.ts
      scan_paths: >-
        src/lib/gaming-endzin.ts
        src/lib/gaming-session.ts
      label: calculator
      perf_eval_ms: 100
      perf_api_ms: 200
