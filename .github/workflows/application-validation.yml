name: SPAJA application validation

# OKRID-2026-GOV-001. Branch validation only; no deployment or merge permission.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spaja-application-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  quality:
    name: SPAJA types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested merge or push revision
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node 24 with SQLite support
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Record and verify tested revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .ci-evidence
          {
            git show --no-patch --format='commit=%H tree=%T parents=%P' HEAD
            printf 'head=%s\nbase=%s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA"
            node --version
            npm --version
          } > .ci-evidence/revision.txt
      - name: Install locked project dependencies
        run: node scripts/ci/run-check.mjs dependencies npm ci --ignore-scripts --no-audit --no-fund
      - name: CI guard regression tests
        shell: bash
        run: |
          python3 scripts/tests/application-gate.test.py
          node --test scripts/tests/ci-tools.test.mjs
      - name: TypeScript
        shell: bash
        run: |
          node scripts/ci/run-check.mjs typecheck node node_modules/typescript/bin/tsc --noEmit --incremental false
          node scripts/ci/run-check.mjs pilot-typecheck node node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution bundler --esModuleInterop scripts/suoc-pilot.ts src/tests/spaja-ultra/pilot.test.ts src/tests/spaja-ultra/vrh.test.ts
      - name: Repository lint
        shell: bash
        run: |
          node scripts/ci/run-check.mjs lint npm run lint
      - name: Retain command results and hashed logs
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spaja-ci-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  tests:
    name: SPAJA tests and security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested merge or push revision
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node 24 with SQLite support
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Record and verify tested revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .ci-evidence
          {
            git show --no-patch --format='commit=%H tree=%T parents=%P' HEAD
            printf 'head=%s\nbase=%s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA"
            node --version
            npm --version
          } > .ci-evidence/revision.txt
      - name: Install locked project dependencies
        run: node scripts/ci/run-check.mjs dependencies npm ci --ignore-scripts --no-audit --no-fund
      - name: Repository tests including both login routes
        shell: bash
        run: |
          node scripts/ci/run-check.mjs tests npm run test:ci
      - name: SUOC durable pilot and VRH reference profiles
        shell: bash
        run: |
          node scripts/ci/run-check.mjs vrh npm run test:vrh
      - name: Retain command results and hashed logs
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spaja-ci-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  build:
    name: SPAJA smoke contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tested merge or push revision
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node 24 with SQLite support
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Record and verify tested revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .ci-evidence
          {
            git show --no-patch --format='commit=%H tree=%T parents=%P' HEAD
            printf 'head=%s\nbase=%s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA"
            node --version
            npm --version
          } > .ci-evidence/revision.txt
      - name: Install locked project dependencies
        run: node scripts/ci/run-check.mjs dependencies npm ci --ignore-scripts --no-audit --no-fund
      - name: Smoke tests
        shell: bash
        run: |
          node scripts/ci/run-check.mjs smoke npm run test:smoke
      - name: Predeploy source contracts without production secrets
        shell: bash
        run: |
          node scripts/ci/run-check.mjs predeploy node scripts/predeploy-check.mjs
          node scripts/ci/run-check.mjs predeploy-contracts node scripts/ci/check-predeploy-contracts.mjs .ci-evidence/predeploy.stdout.log
      - name: Production build without deployment
        shell: bash
        run: |
          node scripts/ci/run-check.mjs build npm run build
      - name: Retain command results and hashed logs
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spaja-ci-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  browser:
    name: SPAJA SUOC browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUOC_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tools/ci-browser/node_modules/playwright
    steps:
      - name: Checkout tested merge or push revision
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node 24 with SQLite support
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Record and verify tested revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .ci-evidence
          {
            git show --no-patch --format='commit=%H tree=%T parents=%P' HEAD
            printf 'head=%s\nbase=%s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA"
            node --version
            npm --version
          } > .ci-evidence/revision.txt
      - name: Install locked project dependencies
        run: node scripts/ci/run-check.mjs dependencies npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked browser tooling
        shell: bash
        run: |
          node scripts/ci/run-check.mjs browser-dependencies npm ci --prefix tools/ci-browser --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and system dependencies
        shell: bash
        run: |
          node scripts/ci/run-check.mjs browser-install node tools/ci-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise real browser and loopback HTTP pilot
        shell: bash
        run: |
          node scripts/ci/run-check.mjs browser node --import tsx --test --test-reporter=tap src/tests/spaja-ultra/pilot-browser.test.mjs
      - name: Retain command results and hashed logs
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spaja-ci-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  gate:
    name: SPAJA application gate
    needs: [quality, tests, build, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      # No checkout or PR-supplied executable in this reporting job.
      - name: Require every validation job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PY_GATE'
          import json, os, sys
          required = {'quality', 'tests', 'build', 'browser'}
          try:
              results = json.loads(os.environ['NEEDS_JSON'])
              valid = isinstance(results, dict) and set(results) == required
              valid = valid and all(
                  isinstance(results[name], dict) and results[name].get('result') == 'success'
                  for name in required
              )
          except (KeyError, ValueError, TypeError):
              valid = False
          if not valid:
              print('Application gate failed: every required job must report success.', file=sys.stderr)
              sys.exit(1)
          print('All application validation jobs succeeded. Security checks and human approval remain separate requirements.')
          PY_GATE
