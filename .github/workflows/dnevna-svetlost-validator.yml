name: DNEVNA SVETLOST — Validator

on:
  pull_request:
    paths:
      - 'src/lib/dnevna-svetlost/**'
      - 'src/app/api/dnevna-svetlost/**'
      - 'src/tests/lib/dnevna-svetlost.test.ts'
      - 'src/tests/api/dnevna-svetlost-route.test.ts'
      - '.github/workflows/dnevna-svetlost-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/dnevna-svetlost/**'
      - 'src/app/api/dnevna-svetlost/**'
      - 'src/tests/lib/dnevna-svetlost.test.ts'
      - 'src/tests/api/dnevna-svetlost-route.test.ts'
  workflow_dispatch:

concurrency:
  group: dnevna-svetlost-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: dnevna-svetlost
      lint_paths: >-
        src/lib/dnevna-svetlost
        src/app/api/dnevna-svetlost
      test_commands: |
        npx tsx src/tests/lib/dnevna-svetlost.test.ts
        npx tsx src/tests/api/dnevna-svetlost-route.test.ts
      scan_paths: >-
        src/lib/dnevna-svetlost
        src/app/api/dnevna-svetlost
      label: dnevna-svetlost
      perf_eval_ms: 50
      perf_api_ms: 200
