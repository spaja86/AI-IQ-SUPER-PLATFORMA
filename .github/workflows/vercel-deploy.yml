# ═══════════════════════════════════════════════════════════
# ▲ Vercel Deploy Pipeline — AI IQ SUPER PLATFORMA
# ═══════════════════════════════════════════════════════════
#
# Deploy hook pipeline: GitHub → Vercel deployment hook.
# Triggeriše se isključivo ručno (workflow_dispatch) kao fallback.
#
# Sekvenca:
#   1. Poziv Vercel Deploy Hook (via VERCEL_DEPLOY_HOOK_AI_IQ secret)
#   2. Audit log u GitHub Summary
#
# Env varijable (GitHub Secrets):
#   VERCEL_DEPLOY_HOOK_AI_IQ — Vercel Deploy Hook URL (Vercel → Settings → Git → Deploy Hooks)
#
# Napomena: Primarni source of truth je Vercel Git integracija
# (automatski deploy pri push-u). Ovaj workflow je manuelni fallback.

name: ▲ Vercel Deploy

on:
  workflow_dispatch:
    inputs:
      razlog:
        description: 'Razlog manuelnog pokretanja'
        required: false
        default: 'Manuelni deploy trigger'

permissions:
  contents: read

jobs:
  deploy:
    name: ▲ Manualni Vercel Deploy Hook
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Preflight — kontekst pokretanja
        run: |
          echo "## 🔍 Vercel Deploy Hook — Preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parametar | Vrednost |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Workflow** | \`${{ github.workflow }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Actor** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Vreme** | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: 🚀 Pokretanje Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_AI_IQ: ${{ secrets.VERCEL_DEPLOY_HOOK_AI_IQ }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_AI_IQ" ]; then
            echo "❌ VERCEL_DEPLOY_HOOK_AI_IQ nije konfigurisan."
            echo "ℹ️ Konfigurišite secret ili koristite direktni Vercel deploy kroz Git integraciju."
            exit 1
          else
            echo "🚀 Pokretanje Vercel Deploy Hook..."
            RESPONSE=$(curl -s -o /tmp/vercel_response.json -w "%{http_code}" \
              -X POST "$VERCEL_DEPLOY_HOOK_AI_IQ" \
              -H "Content-Type: application/json")
            
            if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
              echo "✅ Deploy hook uspešno pokrenut (HTTP $RESPONSE)"
              cat /tmp/vercel_response.json
            else
              echo "❌ Deploy hook greška (HTTP $RESPONSE)"
              cat /tmp/vercel_response.json
              exit 1
            fi
          fi

      - name: 📊 Deploy Audit Log
        if: always()
        run: |
          echo "## ▲ Vercel Deploy — Audit Log" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Polje | Vrednost |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Autor** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Vreme** | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Pokretanje** | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "| **Razlog** | ${{ github.event.inputs.razlog }} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🔗 **Vercel Dashboard:** https://vercel.com/dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "🔗 **Produkcija:** https://ai-iq-super-platforma.vercel.app" >> "$GITHUB_STEP_SUMMARY"
