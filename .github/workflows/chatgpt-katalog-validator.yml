# SpajaUltraOmegaCore -∞Ω+∞ — ChatGPT Katalog Validator
# Kompanija SPAJA — Digitalna Industrija

name: chatgpt-katalog-validator

on:
  push:
    paths:
      - 'src/lib/chatgpt-katalog/**'
      - 'src/app/chatgpt-katalog/**'
      - 'src/app/api/chatgpt-katalog/**'
      - 'src/components/chatgpt-katalog/**'
      - 'src/tests/lib/chatgpt-katalog.test.ts'
      - 'src/tests/api/chatgpt-katalog-route.test.ts'
      - 'docs/CHATGPT-KATALOG.md'
      - 'docs/MULTI-REPO-LINKS.md'
  pull_request:
    paths:
      - 'src/lib/chatgpt-katalog/**'
      - 'src/app/chatgpt-katalog/**'
      - 'src/app/api/chatgpt-katalog/**'
      - 'src/components/chatgpt-katalog/**'
      - 'src/tests/lib/chatgpt-katalog.test.ts'
      - 'src/tests/api/chatgpt-katalog-route.test.ts'
      - 'docs/CHATGPT-KATALOG.md'
      - 'docs/MULTI-REPO-LINKS.md'
    types: [opened, synchronize, reopened, labeled]

jobs:
  chatgpt-katalog-validate:
    name: ChatGPT Katalog Validator
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ChatGPT Katalog lib tests
        run: npx tsx src/tests/lib/chatgpt-katalog.test.ts

      - name: Run ChatGPT Katalog route tests
        run: npx tsx src/tests/api/chatgpt-katalog-route.test.ts

      - name: Audit log
        if: always()
        run: |
          echo "## ChatGPT Katalog Validator Audit Log" >> $GITHUB_STEP_SUMMARY
          echo "- **Agent**: chatgpt-katalog-validator-agent" >> $GITHUB_STEP_SUMMARY
          echo "- **Persona**: chatgpt-katalog-core (octave: 10, hipermreza node: 81)" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scope**: discovery-and-recommendation" >> $GITHUB_STEP_SUMMARY
          echo "- **Catalog mode**: static-reference" >> $GITHUB_STEP_SUMMARY
          echo "- **KPI**: search ≤50ms | compare ≤100ms | API ≤200ms | lookup ≤10ms" >> $GITHUB_STEP_SUMMARY
          echo "- **Multi-repo sync**: spaja86/IO-OPENUI-AO" >> $GITHUB_STEP_SUMMARY
