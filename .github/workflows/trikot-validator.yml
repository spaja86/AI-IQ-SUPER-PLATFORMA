name: TRIKOT — Validator

on:
  pull_request:
    paths:
      - 'src/lib/trikot/**'
      - 'src/app/api/trikot/**'
      - 'src/tests/lib/trikot.test.ts'
      - 'src/tests/api/trikot-route.test.ts'
      - 'docs/TRIKOT.md'
      - 'AGENTS.md'
      - '.agent-config.json'
      - '.github/workflows/trikot-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/trikot/**'
      - 'src/app/api/trikot/**'
      - 'src/tests/lib/trikot.test.ts'
      - 'src/tests/api/trikot-route.test.ts'
      - 'docs/TRIKOT.md'
      - 'AGENTS.md'
      - '.agent-config.json'
      - '.github/workflows/trikot-validator.yml'
  workflow_dispatch:

concurrency:
  group: trikot-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: trikot
      lint_paths: >-
        src/lib/trikot
        src/app/api/trikot
      test_commands: |
        npx tsx src/tests/lib/trikot.test.ts
        npx tsx src/tests/api/trikot-route.test.ts
      scan_paths: >-
        src/lib/trikot
        src/app/api/trikot
      label: trikot
      perf_eval_ms: 50
      perf_api_ms: 200
