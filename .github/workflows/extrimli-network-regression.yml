name: EXTRIMLI network identity regression
on:
  pull_request:
    paths:
      - '.github/workflows/extrimli*'
      - 'scripts/extrimli-network-*'
      - 'src/lib/deploy/spaja-network.ts'
      - 'src/lib/extrimli-extrondol/**'
      - 'src/lib/extrimli-extrem/**'
      - 'src/tests/lib/extrimli*'
      - 'docs/EXTRIMLI-START-DEPLOY.md'
      - 'docs/MULTI-REPO-LINKS.md'
permissions:
  contents: read
jobs:
  network-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test scripts/extrimli-network-gate.test.mjs src/tests/lib/spaja-network.test.ts
      - run: node --import tsx src/tests/lib/extrimli-start-deploy-doc.test.ts
      - run: node --import tsx src/tests/lib/extrimli-extrondol.test.ts
      - run: node --import tsx src/tests/lib/extrimli-extrem.test.ts
      - run: npx tsc --noEmit
