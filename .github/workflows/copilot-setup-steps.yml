name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔍 Preflight — Okruženje i verzije
        run: |
          echo "## 🔍 Preflight — Okruženje" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parametar | Vrednost |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Runner** | \`$RUNNER_OS\` / \`$RUNNER_ARCH\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Node.js** | \`$(node --version)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **npm** | \`$(npm --version)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Workflow** | \`${{ github.workflow }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Actor** | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Vreme** | \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **actions/checkout** | \`v4\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **actions/setup-node** | \`v4 (Node 22)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Fail-fast ako Node.js nije dostupan
          node --version || { echo "❌ Node.js nije dostupan na runneru"; exit 1; }

      - name: 📥 Instalacija zavisnosti
        run: npm ci

      - name: 🔌 Opciona Codex instalacija Vercel alata
        shell: bash
        run: |
          # Repo-scoped bootstrap (npm ci above) je uvek obavezan.
          # Codex plugin/skill instalacije su user-scoped i opcionalne;
          # Copilot cloud agent okruzenje ne garantuje dostupnost codex CLI-ja.
          if command -v codex >/dev/null 2>&1; then
            npm_config_yes=true npx plugins add vercel/vercel-plugin --target codex --scope user -y
            npm_config_yes=true npx skills add vercel-labs/agent-skills -g --agent codex --skill vercel-react-best-practices -y
          else
            echo "Codex CLI nije dostupan u Copilot cloud agent okruzenju; preskacem opcione user-scoped Codex instalacije."
            echo "Repo-scoped bootstrap (npm ci) je vec zavrsen; ovaj korak je intentionally no-op."
          fi
