name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📥 Instalacija zavisnosti
        run: npm ci

      - name: 🔌 Instalacija Vercel plugina za Codex
        run: npx -y plugins add vercel/vercel-plugin --target codex --scope user -y

      - name: ⚛️ Instalacija Vercel React best practices skill-a
        run: npx -y skills add vercel-labs/agent-skills -g --agent codex --skill vercel-react-best-practices -y
