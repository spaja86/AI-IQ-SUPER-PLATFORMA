name: DUET — Validator

on:
  pull_request:
    paths:
      - 'src/lib/duet/**'
      - 'src/lib/extrimli-extrondol/**'
      - 'src/app/api/duet/**'
      - 'src/app/api/extrimli/extrondol/**'
      - 'src/tests/lib/duet.test.ts'
      - 'src/tests/api/duet-route.test.ts'
      - 'src/tests/lib/extrimli-extrondol.test.ts'
      - 'docs/DUET.md'
      - 'docs/EXTRIMLI.md'
      - 'docs/MULTI-REPO-LINKS.md'
      - '.github/workflows/duet-validator.yml'
      - '.github/workflows/extrimli-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/duet/**'
      - 'src/lib/extrimli-extrondol/**'
      - 'src/app/api/duet/**'
      - 'src/app/api/extrimli/extrondol/**'
      - 'src/tests/lib/duet.test.ts'
      - 'src/tests/api/duet-route.test.ts'
      - 'src/tests/lib/extrimli-extrondol.test.ts'
      - 'docs/DUET.md'
      - 'docs/EXTRIMLI.md'
      - 'docs/MULTI-REPO-LINKS.md'
      - '.github/workflows/duet-validator.yml'
      - '.github/workflows/extrimli-validator.yml'
  workflow_dispatch:

concurrency:
  group: duet-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: duet
      lint_paths: >-
        src/lib/duet
        src/lib/extrimli-extrondol
        src/app/api/duet
        src/app/api/extrimli/extrondol
      test_commands: |
        npx tsx src/tests/lib/duet.test.ts
        npx tsx src/tests/api/duet-route.test.ts
        npx tsx src/tests/lib/extrimli-extrondol.test.ts
      scan_paths: >-
        src/lib/duet
        src/lib/extrimli-extrondol
        src/app/api/duet
        src/app/api/extrimli/extrondol
      label: duet
      perf_eval_ms: 50
      perf_api_ms: 200
