# MADAGASKAR Validator Agent
# Kompanija SPAJA — Digitalna Industrija
#
# Triggers on PRs labeled 'madagaskar:logic-change' and on pushes touching madagaskar paths.
# Runs lint, madagaskar test suite, and performance check.
# Auto-labels PRs with 'madagaskar:validated' or 'madagaskar:needs-review'.
# Leaves audit log as a PR comment.

name: madagaskar-validator

on:
  push:
    paths:
      - 'src/lib/madagaskar/**'
      - 'src/app/api/madagaskar/**'
      - 'src/components/madagaskar/**'
      - 'src/tests/lib/madagaskar-*.test.ts'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'src/lib/madagaskar/**'
      - 'src/app/api/madagaskar/**'
      - 'src/components/madagaskar/**'
      - 'src/tests/lib/madagaskar-*.test.ts'

jobs:
  validate:
    name: MADAGASKAR Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        run: npx eslint src/lib/madagaskar src/app/api/madagaskar src/components/madagaskar --ext .ts,.tsx --max-warnings 0
        continue-on-error: true

      - name: Run MADAGASKAR utils tests
        id: test-utils
        run: npx tsx src/tests/lib/madagaskar-utils.test.ts

      - name: Run MADAGASKAR registry tests
        id: test-registry
        run: npx tsx src/tests/lib/madagaskar-registry.test.ts

      - name: Run MADAGASKAR engine tests
        id: test-engine
        run: npx tsx src/tests/lib/madagaskar-engine.test.ts

      - name: Performance check
        id: perf
        run: |
          echo "Performance KPIs for MADAGASKAR:"
          echo "  calculateProcurement: ≤ 50ms (validated in engine tests)"
          echo "  listGoods bulk: ≤ 50ms (validated in registry tests)"
          echo "  API /api/madagaskar/procure: ≤ 200ms (integration gate)"
          echo "✅ Performance gate passed (enforced via test durationMs assertions)"

      - name: Determine outcome
        id: outcome
        if: always()
        run: |
          if [[ "${{ steps.test-utils.outcome }}" == "success" && \
                "${{ steps.test-registry.outcome }}" == "success" && \
                "${{ steps.test-engine.outcome }}" == "success" ]]; then
            echo "result=validated" >> "$GITHUB_OUTPUT"
          else
            echo "result=needs-review" >> "$GITHUB_OUTPUT"
          fi

      - name: Label PR — validated
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.outcome.outputs.result == 'validated'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['madagaskar:validated'],
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'madagaskar:needs-review',
              });
            } catch {}

      - name: Label PR — needs-review
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.outcome.outputs.result == 'needs-review'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['madagaskar:needs-review'],
            });

      - name: Audit log comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const ts = new Date().toISOString();
            const result = '${{ steps.outcome.outputs.result }}';
            const icon = result === 'validated' ? '✅' : '❌';
            const lintStatus = '${{ steps.lint.outcome }}' === 'success' ? '✅' : '⚠️';
            const utilsStatus = '${{ steps.test-utils.outcome }}' === 'success' ? '✅' : '❌';
            const registryStatus = '${{ steps.test-registry.outcome }}' === 'success' ? '✅' : '❌';
            const engineStatus = '${{ steps.test-engine.outcome }}' === 'success' ? '✅' : '❌';

            const body = [
              `## ${icon} MADAGASKAR Validator — Audit Log`,
              '',
              `| Field | Value |`,
              `|---|---|`,
              `| Agent | \`madagaskar-validator-agent\` |`,
              `| Persona | \`madagaskar-exotic-market\` (octave: 5, node: 40) |`,
              `| Timestamp | ${ts} |`,
              `| Result | **${result}** |`,
              `| Run | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |`,
              '',
              `### Gate Results`,
              `| Gate | Status |`,
              `|---|---|`,
              `| Lint | ${lintStatus} |`,
              `| Utils tests | ${utilsStatus} |`,
              `| Registry tests | ${registryStatus} |`,
              `| Engine tests | ${engineStatus} |`,
              '',
              `### KPI`,
              `| Metric | Limit | Status |`,
              `|---|---|---|`,
              `| \`calculateProcurement\` | ≤ 50ms | ${engineStatus} |`,
              `| \`listGoods\` bulk | ≤ 50ms | ${registryStatus} |`,
              `| API \`/api/madagaskar/procure\` | ≤ 200ms | integration |`,
              '',
              `> **madagaskar-validator-agent** · Kompanija SPAJA — Digitalna Industrija`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
