name: 🔐 Security Scanner

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: security-scanner-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependency-review:
    name: 📦 Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 📦 Review dependency changes
        uses: actions/dependency-review-action@56339e523c0409420f6c2c9a2f4292bbb3c07dd3 # v4.8.0
        with:
          fail-on-severity: high

  secret-heuristics:
    name: 🔑 Secret Heuristics
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 🔍 Scan tracked files for likely secrets
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          repo = Path('.')
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          patterns = {
              'github_pat': re.compile(r'github_pat_[A-Za-z0-9_]{20,}'),
              'github_token': re.compile(r'gh[pousr]_[A-Za-z0-9]{20,}'),
              'stripe_live': re.compile(r'sk_live_[A-Za-z0-9]{16,}'),
              'stripe_test': re.compile(r'sk_test_[A-Za-z0-9]{16,}'),
              'stripe_webhook': re.compile(r'whsec_[A-Za-z0-9]{16,}'),
              'aws_key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'slack_token': re.compile(r'xox[baprs]-[A-Za-z0-9-]{10,}'),
              'google_api_key': re.compile(r'AIza[0-9A-Za-z\-_]{35}'),
              'private_key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'),
          }
          ignored_suffixes = {'.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.pdf', '.lock', '.svg'}
          hits = []
          for relative in tracked:
              path = repo / relative
              if path.suffix.lower() in ignored_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              for name, pattern in patterns.items():
                  for match in pattern.finditer(text):
                      line = text.count('\n', 0, match.start()) + 1
                      hits.append(f'{relative}:{line}:{name}')
          if hits:
              print('Potential secrets detected:')
              for hit in hits:
                  print(hit)
              sys.exit(1)
          print('No likely secrets detected in tracked files.')
          PY

  npm-audit:
    name: 🛡️ npm audit
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🛡️ Audit high severity vulnerabilities
        run: npm audit --audit-level=high

  codeql:
    name: 🧠 CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🧠 Initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: 🧠 Analyze
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3

  security-gate:
    name: SPAJA security gate
    needs: [dependency-review, secret-heuristics, npm-audit, codeql]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject missing or skipped PR security checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          VALIDATION_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          python3 - <<'PY_SECURITY_GATE'
          import json, os, sys
          event = os.environ.get('VALIDATION_EVENT')
          expected = {'dependency-review': 'success', 'secret-heuristics': 'success',
                      'npm-audit': 'success', 'codeql': 'success'}
          # Dependency Review is PR-only. Every PR must actually run it.
          if event in ('push', 'schedule', 'workflow_dispatch'):
              expected['dependency-review'] = 'skipped'
          try:
              results = json.loads(os.environ['NEEDS_JSON'])
              valid = event in ('pull_request', 'push', 'schedule', 'workflow_dispatch')
              valid = valid and isinstance(results, dict) and set(results) == set(expected)
              valid = valid and all(
                  isinstance(results[name], dict) and results[name].get('result') == outcome
                  for name, outcome in expected.items()
              )
          except (KeyError, ValueError, TypeError):
              valid = False
          if not valid:
              print('Security gate failed: required results are missing or unsuccessful.', file=sys.stderr)
              sys.exit(1)
          print('Security jobs passed for this event. This is not a deployment authorization.')
          PY_SECURITY_GATE
