name: EKSELENCIO — Validator

on:
  pull_request:
    paths:
      - 'src/lib/ekselencio/**'
      - 'src/app/api/ekselencio/**'
      - 'src/components/ekselencio/**'
      - 'src/tests/lib/ekselencio.test.ts'
      - 'src/tests/api/ekselencio-route.test.ts'
      - '.github/workflows/ekselencio-validator.yml'
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - 'src/lib/ekselencio/**'
      - 'src/app/api/ekselencio/**'
      - 'src/components/ekselencio/**'
      - 'src/tests/lib/ekselencio.test.ts'
      - 'src/tests/api/ekselencio-route.test.ts'
  workflow_dispatch:

concurrency:
  group: ekselencio-validator-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: spaja86/AI-IQ-SUPER-PLATFORMA/.github/workflows/_validator-template.yml@main
    with:
      domain: ekselencio
      lint_paths: >-
        src/lib/ekselencio
        src/app/api/ekselencio
        src/components/ekselencio
      test_commands: |
        npx tsx src/tests/lib/ekselencio.test.ts
        npx tsx src/tests/api/ekselencio-route.test.ts
      scan_paths: >-
        src/lib/ekselencio
        src/app/api/ekselencio
      label: ekselencio
      perf_eval_ms: 50
      perf_api_ms: 200
