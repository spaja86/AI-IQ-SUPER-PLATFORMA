name: EXTRIMLI — Governance Conformance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'src/lib/extrimli-extrondol/**'
      - 'src/lib/extrimli-extrem/**'
      - 'src/app/api/extrimli/extrondol/**'
      - 'src/app/api/extrimli/extrem/**'
      - 'docs/EXTRIMLI.md'
      - 'docs/EXTRIMLI-DEVELOPER-CREATE-PROGRAM.md'
      - 'docs/AI-IQ-PROGRAMSKI-JEZIK.md'
      - 'docs/PROGRAMSKI-JEZIK-INFORMACIONIH-TOKOVA.md'
      - 'docs/PROGRAMSKI-JEZIK-PARADIGMA-I-OBLIKOVANJE-TELA.md'
      - 'docs/EXTRIMLI-EXTERNAL-GITHUB.md'
      - 'docs/MULTI-REPO-LINKS.md'
      - '.github/workflows/extrimli-validator.yml'
      - '.github/workflows/extrimli-external-github.yml'
      - '.github/workflows/extrimli-governance-conformance.yml'

concurrency:
  group: extrimli-governance-conformance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔎 Contract drift checks (docs/types/routes/workflows)
        run: |
          node <<'NODE'
          const fs = require('fs');
          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          const types = fs.readFileSync('src/lib/extrimli-extrondol/types.ts', 'utf8');
          const extrondolIndex = fs.readFileSync('src/lib/extrimli-extrondol/index.ts', 'utf8');
          const route = fs.readFileSync('src/app/api/extrimli/extrondol/route.ts', 'utf8');
          const extremRoute = fs.readFileSync('src/app/api/extrimli/extrem/route.ts', 'utf8');
          const extrimliDoc = fs.readFileSync('docs/EXTRIMLI.md', 'utf8');
          const aiIqDoc = fs.readFileSync('docs/AI-IQ-PROGRAMSKI-JEZIK.md', 'utf8');
          const informacioniTokoviDoc = fs.readFileSync('docs/PROGRAMSKI-JEZIK-INFORMACIONIH-TOKOVA.md', 'utf8');
          const paradigmaDoc = fs.readFileSync('docs/PROGRAMSKI-JEZIK-PARADIGMA-I-OBLIKOVANJE-TELA.md', 'utf8');
          const developerCreateProgramDoc = fs.readFileSync('docs/EXTRIMLI-DEVELOPER-CREATE-PROGRAM.md', 'utf8');
          const externalDoc = fs.readFileSync('docs/EXTRIMLI-EXTERNAL-GITHUB.md', 'utf8');
          const links = fs.readFileSync('docs/MULTI-REPO-LINKS.md', 'utf8');
          const versionRoadmap = fs.readFileSync('src/lib/extrimli-version-roadmap.ts', 'utf8');
          const validatorWorkflow = fs.readFileSync('.github/workflows/extrimli-validator.yml', 'utf8');
          const externalWorkflow = fs.readFileSync('.github/workflows/extrimli-external-github.yml', 'utf8');

          assert(types.includes('export interface ExtrimliExtrondolContractDriftReport'), 'types must expose ExtrimliExtrondolContractDriftReport');
          assert(versionRoadmap.includes('export interface ExtrimliDeveloperCreateProgramLock'), 'roadmap must expose Developer/Create lock type');
          assert(versionRoadmap.includes('developerCreateLock'), 'roadmap must publish Developer/Create lock payload');
          assert(types.includes(\"'.github/workflows/extrimli-governance-conformance.yml'\"), 'types drift artifacts must include conformance workflow');
          assert(
            extrondolIndex.includes('releaseReadinessScorecard') &&
            extrondolIndex.includes('canaryRingMetrics') &&
            extrondolIndex.includes('contractDriftReport') &&
            extrondolIndex.includes('governanceConformance'),
            'EXTRONDOL report builder must include governance conformance fields'
          );
          assert(route.includes("getExtrimliExtrondolReport") && route.includes("surface: 'extrimli-extrondol'"), 'route must expose canonical EXTRONDOL surface');
          assert(extremRoute.includes("getExtrimliExtremProfilerReport") && extremRoute.includes("surface: 'extrimli-extrem'"), 'route must expose canonical EXTREM surface');
          assert(extrimliDoc.includes('releaseReadinessScorecard') && extrimliDoc.includes('canaryRingMetrics') && extrimliDoc.includes('contractDriftReport') && extrimliDoc.includes('governanceConformance'), 'EXTRIMLI doc must include governance conformance fields');
          assert(extrimliDoc.includes('versionRoadmap.developerCreateLock'), 'EXTRIMLI doc must reference the shared Developer/Create lock');
          assert(extrimliDoc.includes('DOK + DIK + FOR'), 'EXTRIMLI doc must lock FOR inside the technical ownership boundary');
          assert(extrimliDoc.includes('programskiJezikProucavanja') && extrimliDoc.includes('programskiEkanalog'), 'EXTRIMLI doc must include Programski jezik proučavanja + programski ekanalog additive fields');
          assert(aiIqDoc.includes('PROGRAMSKI JEZIK PROUČAVANJA') && aiIqDoc.includes('PROGRAMSKI EKANALOG'), 'AI IQ doc must include Programski jezik proučavanja + programski ekanalog profile');
          assert(aiIqDoc.includes('PROGRAMSKI JEZIK INFORMACIONIH TOKOVA') && aiIqDoc.includes('FOR PETLJA'), 'AI IQ doc must include informational-flow DSL profile');
          assert(aiIqDoc.includes('PROGRAMSKI JEZIK PARADIGMA I OBLIKOVANJE TELA') && aiIqDoc.includes('objekat'), 'AI IQ doc must include paradigma/body-shaping DSL profile');
          assert(informacioniTokoviDoc.includes('READY | WATCH | BLOCKED') && informacioniTokoviDoc.includes('FOR PETLJA'), 'informational-flow doc must lock canonical semantics and FOR binding');
          assert(paradigmaDoc.includes('READY | WATCH | BLOCKED') && paradigmaDoc.includes('/api/extrimli/extrem') && paradigmaDoc.includes('/api/extrimli/extrondol'), 'paradigma/body-shaping doc must lock canonical semantics and source-of-truth boundaries');
          assert(types.includes('programskiJezikProucavanja') && extrondolIndex.includes('programskiJezikProucavanja'), 'types and EXTRONDOL index must include Programski jezik proučavanja contract fields');
          assert(types.includes('programskiJezikInformacionihTokova') && extrondolIndex.includes('programskiJezikInformacionihTokova'), 'types and EXTRONDOL index must include informational-flow contract fields');
          assert(types.includes('programskiJezikParadigmaOblikovanjeTela') && extrondolIndex.includes('programskiJezikParadigmaOblikovanjeTela'), 'types and EXTRONDOL index must include paradigma/body-shaping contract fields');
          assert(
            developerCreateProgramDoc.includes('PROGRAM_LOCK_SOURCE_OF_TRUTH') &&
            developerCreateProgramDoc.includes('PROGRAM_LOCK_DRIFT_ZERO') &&
            developerCreateProgramDoc.includes('PROGRAM_LOCK_MACHINE_DOD'),
            'Developer/Create program doc must keep governance lock markers for source-of-truth, drift-zero, and machine-checked DoD'
          );
          assert(
            (developerCreateProgramDoc.includes('DOK + DIK + FOR') || developerCreateProgramDoc.includes('DOK+DIK+FOR'))
              && developerCreateProgramDoc.includes('DOK/DIK/DAK/DUK/FOR'),
            'Developer/Create program doc must lock FOR across ownership and drift-zero language'
          );
          assert(developerCreateProgramDoc.includes('PROGRAMSKI JEZIK PROUČAVANJA') && developerCreateProgramDoc.includes('PROGRAMSKI EKANALOG'), 'Developer/Create program doc must lock Programski jezik proučavanja + programski ekanalog');
          assert(developerCreateProgramDoc.includes('PROGRAMSKI JEZIK PARADIGMA I OBLIKOVANJE TELA'), 'Developer/Create program doc must lock paradigma/body-shaping track');
          assert(developerCreateProgramDoc.includes('docs + types + routes + tests + workflows'), 'Developer/Create program doc must lock docs/types/routes/tests/workflows');
          assert(versionRoadmap.includes('mandatoryArtifacts') && versionRoadmap.includes('implementationStreams') && versionRoadmap.includes('acceptanceLock'), 'roadmap lock must include mandatory artifacts, streams, and acceptance lock');
          assert(externalDoc.includes('.github/workflows/extrimli-governance-conformance.yml'), 'external governance doc must reference conformance workflow');
          assert(links.includes('EXTRIMLI governance conformance audit'), 'multi-repo links must include conformance audit mapping');
          assert(links.includes('PROGRAMSKI JEZIK PARADIGMA I OBLIKOVANJE TELA'), 'multi-repo links must include paradigma/body-shaping downstream mapping');
          assert(links.includes('EXTRIMLI — Developer/Create Program'), 'multi-repo links must include the Developer/Create program downstream mapping');
          assert(links.includes('versionRoadmap.developerCreateLock'), 'multi-repo links must sync the shared Developer/Create lock');
          assert(validatorWorkflow.includes('docs/EXTRIMLI-DEVELOPER-CREATE-PROGRAM.md'), 'validator workflow must watch Developer/Create program doc');
          assert(validatorWorkflow.includes('docs/PROGRAMSKI-JEZIK-PARADIGMA-I-OBLIKOVANJE-TELA.md'), 'validator workflow must watch paradigma/body-shaping doc');
          assert(validatorWorkflow.includes('src/tests/lib/extrimli-extrem.test.ts'), 'validator workflow must watch EXTREM profiler tests');
          assert(validatorWorkflow.includes('.github/workflows/extrimli-governance-conformance.yml'), 'validator workflow must watch governance conformance workflow');
          assert(externalWorkflow.includes('docs/EXTRIMLI-DEVELOPER-CREATE-PROGRAM.md'), 'external workflow must watch Developer/Create program doc');
          assert(externalWorkflow.includes('docs/PROGRAMSKI-JEZIK-PARADIGMA-I-OBLIKOVANJE-TELA.md'), 'external workflow must watch paradigma/body-shaping doc');
          assert(externalWorkflow.includes('src/tests/lib/extrimli-extrem.test.ts'), 'external workflow must watch EXTREM profiler tests');
          assert(externalWorkflow.includes('.github/workflows/extrimli-governance-conformance.yml'), 'external workflow must watch governance conformance workflow');
          NODE

      - name: 🧪 EXTRONDOL governance tests
        run: npx tsx src/tests/lib/extrimli-extrondol.test.ts

      - name: 🧪 EXTREM profiler tests
        run: npx tsx src/tests/lib/extrimli-extrem.test.ts

      - name: 📊 Governance conformance summary
        if: always()
        run: |
          echo "## EXTRIMLI Governance Conformance" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope lock: EXTRIMLI + EXTREM + EXTRONDOL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source-of-truth routes: /api/extrimli/extrem + /api/extrimli/extrondol" >> "$GITHUB_STEP_SUMMARY"
          echo "- Drift checks: docs/types/routes/tests/workflows" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schedule: weekly (Mon 04:00 UTC)" >> "$GITHUB_STEP_SUMMARY"
