name: EXTRIMLI — Governance Conformance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'src/lib/extrimli-extrondol/**'
      - 'src/lib/extrimli-extrem/**'
      - 'src/app/api/extrimli/extrondol/**'
      - 'src/app/api/extrimli/extrem/**'
      - 'docs/EXTRIMLI.md'
      - 'docs/EXTRIMLI-DEVELOPER-CREATE-PROGRAM.md'
      - 'docs/EXTRIMLI-VRH-PROGRAMSKOG-EKVILADENTA.md'
      - 'docs/EXTRIMLI-METRICKO-PROGRAMIRANJE.md'
      - 'docs/EXTRIMLI-SINEMETRICKO-PROGRAMIRANJE.md'
      - 'docs/EXTRIMLI-PARADIJOGONALNO-PROGRAMIRANJE.md'
      - 'docs/AI-IQ-PROGRAMSKI-JEZIK.md'
      - 'docs/PROGRAMSKI-JEZIK-INFORMACIONIH-TOKOVA.md'
      - 'docs/PROGRAMSKI-JEZIK-PARADIGMA-I-OBLIKOVANJE-TELA.md'
      - 'docs/EXTRIMLI-EXTERNAL-GITHUB.md'
      - 'docs/MULTI-REPO-LINKS.md'
      - '.github/workflows/extrimli-validator.yml'
      - '.github/workflows/extrimli-external-github.yml'
      - '.github/workflows/extrimli-governance-conformance.yml'

concurrency:
  group: extrimli-governance-conformance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 📦 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔎 Contract drift checks (docs/types/routes/workflows)
        run: |
          node <<'NODE'
          const fs = require('fs');
          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          const types = fs.readFileSync('src/lib/extrimli-extrondol/types.ts', 'utf8');
          const extrondolIndex = fs.readFileSync('src/lib/extrimli-extrondol/index.ts', 'utf8');
          const route = fs.readFileSync('src/app/api/extrimli/extrondol/route.ts', 'utf8');
          const extremRoute = fs.readFileSync('src/app/api/extrimli/extrem/route.ts', 'utf8');
          const extrimliDoc = fs.readFileSync('docs/EXTRIMLI.md', 'utf8');
          const aiIqDoc = fs.readFileSync('docs/AI-IQ-PROGRAMSKI-JEZIK.md', 'utf8');
          const informacioniTokoviDoc = fs.readFileSync('docs/PROGRAMSKI-JEZIK-INFORMACIONIH-TOKOVA.md', 'utf8');
          const paradigmaDoc = fs.readFileSync('docs/PROGRAMSKI-JEZIK-PARADIGMA-I-OBLIKOVANJE-TELA.md', 'utf8');
          const developerCreateProgramDoc = fs.readFileSync('docs/EXTRIMLI-DEVELOPER-CREATE-PROGRAM.md', 'utf8');
          const vrhDoc = fs.readFileSync('docs/EXTRIMLI-VRH-PROGRAMSKOG-EKVILADENTA.md', 'utf8');
          const metrikoDoc = fs.readFileSync('docs/EXTRIMLI-METRICKO-PROGRAMIRANJE.md', 'utf8');
          const sinemetrickoDoc = fs.readFileSync('docs/EXTRIMLI-SINEMETRICKO-PROGRAMIRANJE.md', 'utf8');
          const paradijogonalnoDoc = fs.readFileSync('docs/EXTRIMLI-PARADIJOGONALNO-PROGRAMIRANJE.md', 'utf8');
          const externalDoc = fs.readFileSync('docs/EXTRIMLI-EXTERNAL-GITHUB.md', 'utf8');
          const links = fs.readFileSync('docs/MULTI-REPO-LINKS.md', 'utf8');
          const versionRoadmap = fs.readFileSync('src/lib/extrimli-version-roadmap.ts', 'utf8');
          const validatorWorkflow = fs.readFileSync('.github/workflows/extrimli-validator.yml', 'utf8');
          const externalWorkflow = fs.readFileSync('.github/workflows/extrimli-external-github.yml', 'utf8');

          assert(types.includes('export interface ExtrimliExtrondolContractDriftReport'), 'types must expose ExtrimliExtrondolContractDriftReport');
          assert(versionRoadmap.includes('export interface ExtrimliDeveloperCreateProgramLock'), 'roadmap must expose Developer/Create lock type');
          assert(versionRoadmap.includes('developerCreateLock'), 'roadmap must publish Developer/Create lock payload');
          assert(versionRoadmap.includes('docs/EXTRIMLI-VRH-PROGRAMSKOG-EKVILADENTA.md'), 'roadmap lock must include VRH doc artifact');
          assert(versionRoadmap.includes('docs/EXTRIMLI-METRICKO-PROGRAMIRANJE.md'), 'roadmap lock must include METRIČKO doc artifact');
          assert(versionRoadmap.includes('docs/EXTRIMLI-SINEMETRICKO-PROGRAMIRANJE.md'), 'roadmap lock must include SINEMETRIČKO doc artifact');
          assert(versionRoadmap.includes('docs/EXTRIMLI-PARADIJOGONALNO-PROGRAMIRANJE.md'), 'roadmap lock must include PARADIJOGONALNO doc artifact');
          assert(versionRoadmap.includes('docs/MULTI-REPO-LINKS.md'), 'roadmap lock must include multi-repo links artifact');
          assert(versionRoadmap.includes('docs/EXTRIMLI-EXTERNAL-GITHUB.md'), 'roadmap lock must include external GitHub doc artifact');
          assert(versionRoadmap.includes('src/app/api/extrimli/spaja-kod/route.ts'), 'roadmap lock must include SPAJA KOD route artifact');
          assert(types.includes(\"'.github/workflows/extrimli-governance-conformance.yml'\"), 'types drift artifacts must include conformance workflow');
          assert(
            extrondolIndex.includes('releaseReadinessScorecard') &&
            extrondolIndex.includes('canaryRingMetrics') &&
            extrondolIndex.includes('contractDriftReport') &&
            extrondolIndex.includes('governanceConformance'),
            'EXTRONDOL report builder must include governance conformance fields'
          );
          assert(route.includes("getExtrimliExtrondolReport") && route.includes("surface: 'extrimli-extrondol'"), 'route must expose canonical EXTRONDOL surface');
          assert(extremRoute.includes("getExtrimliExtremProfilerReport") && extremRoute.includes("surface: 'extrimli-extrem'"), 'route must expose canonical EXTREM surface');
          assert(extrimliDoc.includes('releaseReadinessScorecard') && extrimliDoc.includes('canaryRingMetrics') && extrimliDoc.includes('contractDriftReport') && extrimliDoc.includes('governanceConformance'), 'EXTRIMLI doc must include governance conformance fields');
          assert(extrimliDoc.includes('versionRoadmap.developerCreateLock'), 'EXTRIMLI doc must reference the shared Developer/Create lock');
          assert(extrimliDoc.includes('DOK + DIK + FOR'), 'EXTRIMLI doc must lock FOR inside the technical ownership boundary');
          assert(extrimliDoc.includes('programskiJezikProucavanja') && extrimliDoc.includes('programskiEkanalog'), 'EXTRIMLI doc must include Programski jezik proučavanja + programski ekanalog additive fields');
          assert(aiIqDoc.includes('PROGRAMSKI JEZIK PROUČAVANJA') && aiIqDoc.includes('PROGRAMSKI EKANALOG'), 'AI IQ doc must include Programski jezik proučavanja + programski ekanalog profile');
          assert(aiIqDoc.includes('PROGRAMSKI JEZIK INFORMACIONIH TOKOVA') && aiIqDoc.includes('FOR PETLJA'), 'AI IQ doc must include informational-flow DSL profile');
          assert(aiIqDoc.includes('PROGRAMSKI JEZIK PARADIGMA I OBLIKOVANJE TELA') && aiIqDoc.includes('objekat'), 'AI IQ doc must include paradigma/body-shaping DSL profile');
          assert(aiIqDoc.includes('DEVELOPER AND CREATE == VRH PROGRAMSKOG EKVILADENTA == RADNI TAKT MOZGA (MISLILAC)'), 'AI IQ doc must lock the repo-wide Developer/Create reflection');
          assert(aiIqDoc.includes('METRIČKO') && aiIqDoc.includes('SINEMETRIČKO') && aiIqDoc.includes('PARADIJOGONALNO'), 'AI IQ doc must map the repo-wide reflection tracks');
          assert(informacioniTokoviDoc.includes('READY | WATCH | BLOCKED') && informacioniTokoviDoc.includes('FOR PETLJA'), 'informational-flow doc must lock canonical semantics and FOR binding');
          assert(paradigmaDoc.includes('READY | WATCH | BLOCKED') && paradigmaDoc.includes('/api/extrimli/extrem') && paradigmaDoc.includes('/api/extrimli/extrondol'), 'paradigma/body-shaping doc must lock canonical semantics and source-of-truth boundaries');
          assert(types.includes('programskiJezikProucavanja') && extrondolIndex.includes('programskiJezikProucavanja'), 'types and EXTRONDOL index must include Programski jezik proučavanja contract fields');
          assert(types.includes('programskiJezikInformacionihTokova') && extrondolIndex.includes('programskiJezikInformacionihTokova'), 'types and EXTRONDOL index must include informational-flow contract fields');
          assert(types.includes('programskiJezikParadigmaOblikovanjeTela') && extrondolIndex.includes('programskiJezikParadigmaOblikovanjeTela'), 'types and EXTRONDOL index must include paradigma/body-shaping contract fields');
          assert(
            developerCreateProgramDoc.includes('PROGRAM_LOCK_SOURCE_OF_TRUTH') &&
            developerCreateProgramDoc.includes('PROGRAM_LOCK_DRIFT_ZERO') &&
            developerCreateProgramDoc.includes('PROGRAM_LOCK_MACHINE_DOD'),
            'Developer/Create program doc must keep governance lock markers for source-of-truth, drift-zero, and machine-checked DoD'
          );
          assert(
            (developerCreateProgramDoc.includes('DOK + DIK + FOR') || developerCreateProgramDoc.includes('DOK+DIK+FOR'))
              && developerCreateProgramDoc.includes('DOK/DIK/DAK/DUK/FOR'),
            'Developer/Create program doc must lock FOR across ownership and drift-zero language'
          );
          assert(developerCreateProgramDoc.includes('PROGRAMSKI JEZIK PROUČAVANJA') && developerCreateProgramDoc.includes('PROGRAMSKI EKANALOG'), 'Developer/Create program doc must lock Programski jezik proučavanja + programski ekanalog');
          assert(developerCreateProgramDoc.includes('PROGRAMSKI JEZIK PARADIGMA I OBLIKOVANJE TELA'), 'Developer/Create program doc must lock paradigma/body-shaping track');
          assert(developerCreateProgramDoc.includes('docs + types + routes + tests + workflows'), 'Developer/Create program doc must lock docs/types/routes/tests/workflows');
          assert(developerCreateProgramDoc.includes('DEVELOPER AND CREATE == VRH PROGRAMSKOG EKVILADENTA == RADNI TAKT MOZGA (MISLILAC)'), 'Developer/Create program doc must lock repo-wide equality mapping');
          assert(developerCreateProgramDoc.includes('roadmapStageId=Verzija 7') && developerCreateProgramDoc.includes('premium-rollout-regime'), 'Developer/Create program doc must lock AI PLATE V7 execution and pricing governance');
          assert(vrhDoc.includes('DEVELOPER AND CREATE == VRH PROGRAMSKOG EKVILADENTA == RADNI TAKT MOZGA (MISLILAC)'), 'VRH doc must lock repo-wide equality mapping');
          assert(vrhDoc.includes('AI PLATE') && vrhDoc.includes('12.000 EUR nedeljno'), 'VRH doc must lock AI PLATE enterprise package');
          assert(vrhDoc.includes('v5-extrondol-release-audit-and-orchestration'), 'VRH doc must lock the active Developer/Create execution stage');
          assert(metrikoDoc.includes('/api/extrimli/extrem') && metrikoDoc.includes('/api/extrimli/extrondol') && metrikoDoc.includes('/api/extrimli/spaja-kod'), 'METRIČKO doc must keep source-of-truth routes locked');
          assert(metrikoDoc.includes('dokDikDakDukConsistencyHealth.developerAndCreateRepoWideReflection'), 'METRIČKO doc must reference the central repo-wide reflection proof');
          assert(metrikoDoc.includes('technicalReadinessProfile'), 'METRIČKO doc must reference the shared technical readiness profile');
          assert(metrikoDoc.includes('DOK + DIK + FOR') && metrikoDoc.includes('DAK + DUK'), 'METRIČKO doc must lock technical/governance ownership split');
          assert(metrikoDoc.includes('READY | WATCH | BLOCKED') && metrikoDoc.includes('NaN') && metrikoDoc.includes('Infinity'), 'METRIČKO doc must keep deterministic fallback semantics');
          assert(sinemetrickoDoc.includes('DEVELOPER AND CREATE == VRH PROGRAMSKOG EKVILADENTA == RADNI TAKT MOZGA (MISLILAC)'), 'SINEMETRIČKO doc must lock repo-wide equality mapping');
          assert(sinemetrickoDoc.includes('dokDikDakDukConsistencyHealth.developerAndCreateRepoWideReflection'), 'SINEMETRIČKO doc must reference the central repo-wide reflection proof');
          assert(sinemetrickoDoc.includes('technicalReadinessProfile'), 'SINEMETRIČKO doc must reference the shared technical readiness profile');
          assert(sinemetrickoDoc.includes('DOK + DIK + FOR') && sinemetrickoDoc.includes('DAK + DUK'), 'SINEMETRIČKO doc must lock technical/governance ownership split');
          assert(sinemetrickoDoc.includes('READY | WATCH | BLOCKED') && sinemetrickoDoc.includes('NaN/Infinity'), 'SINEMETRIČKO doc must keep deterministic fallback semantics');
          assert(paradijogonalnoDoc.includes('/api/extrimli/extrem') && paradijogonalnoDoc.includes('/api/extrimli/extrondol') && paradijogonalnoDoc.includes('/api/extrimli/spaja-kod'), 'PARADIJOGONALNO doc must keep source-of-truth routes locked');
          assert(paradijogonalnoDoc.includes('DEVELOPER AND CREATE == VRH PROGRAMSKOG EKVILADENTA == RADNI TAKT MOZGA (MISLILAC)'), 'PARADIJOGONALNO doc must lock repo-wide equality mapping');
          assert(paradijogonalnoDoc.includes('dokDikDakDukConsistencyHealth.developerAndCreateRepoWideReflection'), 'PARADIJOGONALNO doc must reference the central repo-wide reflection proof');
          assert(paradijogonalnoDoc.includes('technicalReadinessProfile'), 'PARADIJOGONALNO doc must reference the shared technical readiness profile');
          assert(paradijogonalnoDoc.includes('FOR') && paradijogonalnoDoc.includes('DAK') && paradijogonalnoDoc.includes('DUK'), 'PARADIJOGONALNO doc must lock technical/governance ownership split');
          assert(paradijogonalnoDoc.includes('READY | WATCH | BLOCKED') && paradijogonalnoDoc.includes('NaN') && paradijogonalnoDoc.includes('Infinity'), 'PARADIJOGONALNO doc must keep deterministic fallback semantics');
          assert(types.includes('developerAndCreateRepoWideReflection') && extrondolIndex.includes('developerAndCreateRepoWideReflection'), 'types and EXTRONDOL index must include developer/create repo-wide reflection contract fields');
          assert(types.includes('aiPlateEnterprisePackage') && extrondolIndex.includes('aiPlateEnterprisePackage'), 'types and EXTRONDOL index must include AI PLATE enterprise package contract fields');
          assert(types.includes('technicalReadinessProfile') && extrondolIndex.includes('technicalReadinessProfile'), 'types and EXTRONDOL index must include technical readiness profile fields for repo-wide reflection');
          assert(types.includes('roadmapExecution') && extrondolIndex.includes('roadmapExecution'), 'types and EXTRONDOL index must include roadmap execution fields for repo-wide reflection');
          assert(extrimliDoc.includes('dokDikDakDukConsistencyHealth.developerAndCreateRepoWideReflection'), 'EXTRIMLI doc must include developer/create consistency proof field');
          assert(extrimliDoc.includes('technicalReadinessProfile') && extrimliDoc.includes('v5-extrondol-release-audit-and-orchestration'), 'EXTRIMLI doc must include the technical readiness profile and active execution stage');
          assert(versionRoadmap.includes('mandatoryArtifacts') && versionRoadmap.includes('implementationStreams') && versionRoadmap.includes('acceptanceLock'), 'roadmap lock must include mandatory artifacts, streams, and acceptance lock');
          assert(versionRoadmap.includes('prExecutionLock') && versionRoadmap.includes('operationalAuditPackage'), 'roadmap lock must include PR execution and operational audit package requirements');
          assert(versionRoadmap.includes('dailyOperationalCadence') && versionRoadmap.includes('morning-startup') && versionRoadmap.includes('deep-focus-block') && versionRoadmap.includes('midday-checkpoint') && versionRoadmap.includes('end-of-day-closeout'), 'roadmap lock must include daily operational cadence blocks');
          assert(developerCreateProgramDoc.includes('PR execution lock') && developerCreateProgramDoc.includes('roadmapStageId') && developerCreateProgramDoc.includes('measurableOutput') && developerCreateProgramDoc.includes('acceptanceEvidence'), 'Developer/Create program doc must lock PR execution mapping fields');
          assert(developerCreateProgramDoc.includes('v5-extrondol-release-audit-and-orchestration') && developerCreateProgramDoc.includes('technicalReadinessProfile'), 'Developer/Create program doc must lock the active execution stage and technical readiness profile');
          assert(developerCreateProgramDoc.includes('covecnostAuditVisualReference') && developerCreateProgramDoc.includes('4790f4ea-4271-4d2a-ae0a-d9bec5bc8b8a'), 'Developer/Create program doc must lock the ČOVEČNOST audit visual reference');
          assert(developerCreateProgramDoc.includes('supplementalVisualReferences') && developerCreateProgramDoc.includes('27ef7575-9ef6-425e-bdbf-75feb722bad2'), 'Developer/Create program doc must lock the ČOVEČANSTVO supplemental audit visual reference');
          assert(developerCreateProgramDoc.includes('supplementalVisualReferences') && developerCreateProgramDoc.includes('f7b3e102-e0a0-4885-a93e-040f09454737'), 'Developer/Create program doc must lock the ČOVEČANSTVO ENTIZUJAŽAM supplemental audit visual reference');
          assert(developerCreateProgramDoc.includes('supplementalVisualReferences') && developerCreateProgramDoc.includes('908ab1a4-5a00-4f93-971a-2cd8e331119d'), 'Developer/Create program doc must lock the ČOVEČANSTVO MATIČNE ĆELIJE supplemental audit visual reference');
          assert(developerCreateProgramDoc.includes('companionAuditVisualReferences') && developerCreateProgramDoc.includes('9273c07f-5c03-4db4-a469-d22d456596f9'), 'Developer/Create program doc must lock the ČOVEČANSTVO / OSEĆAJ OSEBENOSTI companion audit visual reference');
          assert(developerCreateProgramDoc.includes('Standardizovani operativni audit paket') && developerCreateProgramDoc.includes('rolloutPlan') && developerCreateProgramDoc.includes('rollbackPlan') && developerCreateProgramDoc.includes('kpiImpact') && developerCreateProgramDoc.includes('humanReviewStatus') && developerCreateProgramDoc.includes('downstreamReference'), 'Developer/Create program doc must lock operational audit package fields');
          assert(developerCreateProgramDoc.includes('morning-startup') && developerCreateProgramDoc.includes('deep-focus-block') && developerCreateProgramDoc.includes('midday-checkpoint') && developerCreateProgramDoc.includes('end-of-day-closeout'), 'Developer/Create program doc must lock daily cadence blocks');
          assert(developerCreateProgramDoc.includes('completed | carried-over | blocked') && developerCreateProgramDoc.includes('priority') && developerCreateProgramDoc.includes('1 | 2 | 3'), 'Developer/Create program doc must lock daily task priorities and closeout statuses');
          assert(vrhDoc.includes('covecnostAuditVisualReference') && vrhDoc.includes('4790f4ea-4271-4d2a-ae0a-d9bec5bc8b8a'), 'VRH doc must lock the ČOVEČNOST audit visual reference');
          assert(vrhDoc.includes('supplementalVisualReferences') && vrhDoc.includes('27ef7575-9ef6-425e-bdbf-75feb722bad2'), 'VRH doc must lock the ČOVEČANSTVO supplemental audit visual reference');
          assert(vrhDoc.includes('supplementalVisualReferences') && vrhDoc.includes('f7b3e102-e0a0-4885-a93e-040f09454737'), 'VRH doc must lock the ČOVEČANSTVO ENTIZUJAŽAM supplemental audit visual reference');
          assert(vrhDoc.includes('supplementalVisualReferences') && vrhDoc.includes('908ab1a4-5a00-4f93-971a-2cd8e331119d'), 'VRH doc must lock the ČOVEČANSTVO MATIČNE ĆELIJE supplemental audit visual reference');
          assert(vrhDoc.includes('companionAuditVisualReferences') && vrhDoc.includes('9273c07f-5c03-4db4-a469-d22d456596f9'), 'VRH doc must lock the ČOVEČANSTVO / OSEĆAJ OSEBENOSTI companion audit visual reference');
          assert(externalDoc.includes('.github/workflows/extrimli-governance-conformance.yml'), 'external governance doc must reference conformance workflow');
          assert(externalDoc.includes('DEVELOPER AND CREATE == VRH PROGRAMSKOG EKVILADENTA == RADNI TAKT MOZGA (MISLILAC)'), 'external governance doc must lock repo-wide reflection');
          assert(externalDoc.includes('DEVELOPER AND CREATE / VRH PROGRAMSKOG EKVILADENTA / AI PLATE') && externalDoc.includes('paymentCycle=monthly-or-annual'), 'external governance doc must lock AI PLATE package and master billing cadence');
          assert(externalDoc.includes('roadmapStageId') && externalDoc.includes('measurableOutput') && externalDoc.includes('acceptanceEvidence'), 'external governance doc must include PR execution lock fields');
          assert(externalDoc.includes('rolloutPlan') && externalDoc.includes('rollbackPlan') && externalDoc.includes('kpiImpact') && externalDoc.includes('humanReviewStatus') && externalDoc.includes('downstreamReference'), 'external governance doc must include audit package lock fields');
          assert(links.includes('EXTRIMLI governance conformance audit'), 'multi-repo links must include conformance audit mapping');
          assert(links.includes('AI PLATE enterprise package') && links.includes('audit-safe snapshot'), 'multi-repo links must lock AI PLATE downstream snapshot boundary');
          assert(links.includes('PROGRAMSKI JEZIK PARADIGMA I OBLIKOVANJE TELA'), 'multi-repo links must include paradigma/body-shaping downstream mapping');
          assert(links.includes('EXTRIMLI — Developer/Create Program'), 'multi-repo links must include the Developer/Create program downstream mapping');
          assert(links.includes('versionRoadmap.developerCreateLock'), 'multi-repo links must sync the shared Developer/Create lock');
          assert(links.includes('PR execution lock') && links.includes('roadmapStageId') && links.includes('measurableOutput') && links.includes('acceptanceEvidence'), 'multi-repo links must sync PR execution lock fields');
          assert(links.includes('v5-extrondol-release-audit-and-orchestration') && links.includes('follow-up only'), 'multi-repo links must sync the active execution stage and follow-up-only downstream boundary');
          assert(links.includes('covecnost-developer-create-vrh-radni-takt') && links.includes('spajaKod.developerAndCreateVisualReflection'), 'multi-repo links must sync the ČOVEČNOST audit visual downstream mapping');
          assert(links.includes('covecanstvo-poker-zivotna-igra-developer-create') && links.includes('supplementalVisualReferences'), 'multi-repo links must sync the ČOVEČANSTVO supplemental audit visual downstream mapping');
          assert(links.includes('covecanstvo-entizujazam-zvezde-misli-inovacije-developer-create') && links.includes('supplementalVisualReferences'), 'multi-repo links must sync the ČOVEČANSTVO ENTIZUJAŽAM supplemental audit visual downstream mapping');
          assert(links.includes('covecanstvo-maticne-celije-i-spoznavanje-sebe-developer-create') && links.includes('supplementalVisualReferences'), 'multi-repo links must sync the ČOVEČANSTVO MATIČNE ĆELIJE supplemental audit visual downstream mapping');
          assert(links.includes('covecanstvo-osecaj-osebenosti-developer-create-vrh-radni-takt') && links.includes('companionAuditVisualReferences'), 'multi-repo links must sync the ČOVEČANSTVO / OSEĆAJ OSEBENOSTI companion audit visual downstream mapping');
          assert(links.includes('Audit package lock') && links.includes('rolloutPlan') && links.includes('rollbackPlan') && links.includes('kpiImpact') && links.includes('humanReviewStatus') && links.includes('downstreamReference'), 'multi-repo links must sync operational audit package fields');
          assert(links.includes('daily cadence lock') && links.includes('morning-startup') && links.includes('completed | carried-over | blocked'), 'multi-repo links must sync daily cadence governance fields');
          assert(types.includes('dailyOperationalCadence') && extrondolIndex.includes('dailyOperationalCadence'), 'types and EXTRONDOL index must include daily operational cadence fields');
          assert(types.includes('covecnostAuditVisualReference') && extrondolIndex.includes('covecnostAuditVisualReference'), 'types and EXTRONDOL index must include the ČOVEČNOST audit visual reference fields');
          assert(types.includes('supplementalVisualReferences') && extrondolIndex.includes('supplementalVisualReferences'), 'types and EXTRONDOL index must include the supplemental developer/create audit visual fields under the shared ČOVEČNOST visual contract');
          assert(types.includes('companionAuditVisualReferences') && extrondolIndex.includes('covecnostAuditVisualReference') && extrondolIndex.includes('companionAuditVisualReferences'), 'types and EXTRONDOL index must include the companion developer/create audit visual fields under the shared ČOVEČNOST visual contract');
          assert(validatorWorkflow.includes('docs/EXTRIMLI-DEVELOPER-CREATE-PROGRAM.md'), 'validator workflow must watch Developer/Create program doc');
          assert(validatorWorkflow.includes('docs/EXTRIMLI-METRICKO-PROGRAMIRANJE.md'), 'validator workflow must watch METRIČKO doc');
          assert(validatorWorkflow.includes('docs/EXTRIMLI-SINEMETRICKO-PROGRAMIRANJE.md'), 'validator workflow must watch SINEMETRIČKO doc');
          assert(validatorWorkflow.includes('docs/EXTRIMLI-PARADIJOGONALNO-PROGRAMIRANJE.md'), 'validator workflow must watch PARADIJOGONALNO doc');
          assert(validatorWorkflow.includes('docs/PROGRAMSKI-JEZIK-PARADIGMA-I-OBLIKOVANJE-TELA.md'), 'validator workflow must watch paradigma/body-shaping doc');
          assert(validatorWorkflow.includes('src/tests/lib/extrimli-extrem.test.ts'), 'validator workflow must watch EXTREM profiler tests');
          assert(validatorWorkflow.includes('.github/workflows/extrimli-governance-conformance.yml'), 'validator workflow must watch governance conformance workflow');
          assert(externalWorkflow.includes('docs/EXTRIMLI-DEVELOPER-CREATE-PROGRAM.md'), 'external workflow must watch Developer/Create program doc');
          assert(externalWorkflow.includes('docs/EXTRIMLI-METRICKO-PROGRAMIRANJE.md'), 'external workflow must watch METRIČKO doc');
          assert(externalWorkflow.includes('docs/EXTRIMLI-SINEMETRICKO-PROGRAMIRANJE.md'), 'external workflow must watch SINEMETRIČKO doc');
          assert(externalWorkflow.includes('docs/EXTRIMLI-PARADIJOGONALNO-PROGRAMIRANJE.md'), 'external workflow must watch PARADIJOGONALNO doc');
          assert(externalWorkflow.includes('docs/PROGRAMSKI-JEZIK-PARADIGMA-I-OBLIKOVANJE-TELA.md'), 'external workflow must watch paradigma/body-shaping doc');
          assert(externalWorkflow.includes('src/tests/lib/extrimli-extrem.test.ts'), 'external workflow must watch EXTREM profiler tests');
          assert(externalWorkflow.includes('.github/workflows/extrimli-governance-conformance.yml'), 'external workflow must watch governance conformance workflow');
          NODE

      - name: 🧪 EXTRONDOL governance tests
        run: npx tsx src/tests/lib/extrimli-extrondol.test.ts

      - name: 🧪 EXTREM profiler tests
        run: npx tsx src/tests/lib/extrimli-extrem.test.ts

      - name: 📊 Governance conformance summary
        if: always()
        run: |
          echo "## EXTRIMLI Governance Conformance" >> "$GITHUB_STEP_SUMMARY"
